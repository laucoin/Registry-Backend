# Since Spring Framework 6.1 the TestContext cache fails fast: after a single context
# load failure it refuses to retry that exact configuration and every later test sharing
# it dies with "ApplicationContext failure threshold (1) exceeded". Under parallel-fork CI
# (maxParallelForks = availableProcessors), several forks boot the full app plus their own
# Postgres Testcontainer at once; when one fork's first boot times out under that load it
# poisons the shared context and cascades into hundreds of misleading failures.
#
# This is a retry budget, not an error budget: it is the number of failed load attempts
# tolerated for a given context before the framework stops retrying and fails fast. Each
# test still needs a successfully loaded context to run - nothing broken slips through.
# A small value lets a transient first-boot failure self-heal on the next attempt while
# still failing fast (rather than re-booting Spring + Postgres many times) if the context
# is genuinely broken.
spring.test.context.failure.threshold=3
