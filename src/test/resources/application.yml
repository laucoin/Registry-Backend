external:
  idp:
    jwks-uri: https://test.idp.com/jwks
    authorization-uri: https://test.idp.com/authorize
    token-uri: https://test.idp.com/token
    end-session-uri: https://test.idp.com/logout
    client-id: client-test
    client-secret: secret-test
    swagger:
      client-id: client-swagger
  cors:
    urls: https://test.frontend.com

logging:
  level:
    fr.laucoin.registry.backend: ${registry.server.logging-level}
    org.springframework.web: ${registry.server.logging-level}
    org.springframework.security.oauth2: ${registry.server.logging-level}
    org.springframework.security.oauth2.client: ${registry.server.logging-level}
    org.flywaydb: ${registry.server.logging-level}
    org.springframework.boot.actuate.endpoint.EndpointId: ${registry.server.logging-level}

management:
  server:
    port: ${registry.server.management-port}
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus,openapi,swagger-ui
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

registry:
  datasource:
    schemas: ${DATASOURCE_SCHEMAS}
    base-url: ${DATASOURCE_BASE_URL}
    database: ${DATASOURCE_DATABASE}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  feature:
    documentation:
      enabled: true
    observability:
      enabled: true
    profile:
      searched:
        max-user-result: 10
    participant:
      searched:
        max-user-result: 10
        max-group-result: 10
    group:
      searched:
        max-participant-result: 10
    movement:
      searched:
        max-participant-result: 10
        max-group-result: 5
        max-vehicle-result: 10
        max-activity-result: 10
    communication:
      searched:
        max-activity-result: 10
        max-alert-result: 10
    purge:
      projects:
        cron: 0 30 1 * * *
        months-threshold: 12
        content:
          cron: 0 0 2 * * *
          months-threshold: 12
        configuration:
          cron: 0 30 2 * * *
          months-threshold: 12
      users:
        cron: 0 0 1 * * *
        months-threshold: 12
  information:
    name: Registry
    description: This application allows virtual registry management. This is a backend which one is called by the frontend.
    locale:
      default: en
      supported: en,fr
    support:
      name: Luc AUCOIN
      email: luc.aucoin1998@gmail.com
      url: https://doc.laucoin.fr/registry/
  security:
    default-role: USER
    cookie:
      secure: false
    oauth2:
      jwks-uri: ${external.idp.jwks-uri}
      authorization-uri: ${external.idp.authorization-uri}
      end-session-uri: ${external.idp.end-session-uri}
      token-uri: ${external.idp.token-uri}
      client-id: ${external.idp.client-id}
      client-secret: ${external.idp.client-secret}
      claims:
        user-id: sub
        email: email
        first-name: given_name
        last-name: family_name
  server:
    prefix: /api
    port: 8081
    management-port: 8082
    logging-level: INFO

server:
  port: ${registry.server.port}

spring:
  application:
    name: ${registry.information.name}
  flyway:
    schemas: ${registry.datasource.schemas}
    url: jdbc:postgresql://${registry.datasource.base-url}/${registry.datasource.database}
    user: ${registry.datasource.username}
    password: ${registry.datasource.password}
    locations:
      - classpath:db/migrations
      - classpath:db/seed-test
  main:
    web-application-type: reactive
    banner-mode: off
  r2dbc:
    url: r2dbc:pool:postgresql://${registry.datasource.base-url}/${registry.datasource.database}?currentSchema=${registry.datasource.schemas}
    username: ${registry.datasource.username}
    password: ${registry.datasource.password}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${registry.security.oauth2.jwks-uri}

springdoc:
  use-management-port: true
  api-docs:
    enabled: ${registry.feature.documentation.enabled}
  swagger-ui:
    enabled: ${registry.feature.documentation.enabled}
    oauth:
      client-id: ${external.idp.swagger.client-id}
