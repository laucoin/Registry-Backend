external:
  cors:
    urls: https://test.frontend.com
  oidc:
    jwks-uri: https://test.oidc.com/jwks
    authorization-uri: https://test.oidc.com/authorize
    token-uri: https://test.oidc.com/token
    end-session-uri: https://test.oidc.com/logout
    client-id: client-test
    client-secret: secret-test
    swagger:
      client-id: client-swagger
      client-secret: client-swagger-secret

registry:
  information:
    name: Registry Test
    description: This is the Registry Test application instance.
    locale:
      default: en
      supported: en,fr
    support:
      name: John DOE
      email: john.doe@test.com
      url: https://test.com
  feature:
    documentation:
      enabled: true
    observability:
      enabled: true
    profile:
      searched:
        max-user-result: 1
    participant:
      searched:
        max-user-result: 1
        max-group-result: 1
    group:
      searched:
        max-participant-result: 1
    movement:
      searched:
        max-participant-result: 1
        max-group-result: 1
        max-vehicle-result: 1
        max-activity-result: 1
    communication:
      searched:
        max-activity-result: 1
        max-alert-result: 1
    purge:
      projects:
        cron: 0 30 1 * * *
        months-threshold: 12
        content: # Groupment of movements, communications and alerts
          cron: 0 0 2 * * *
          months-threshold: 12
        configuration: # Groupment of vehicles, activities, groups and participants
          cron: 0 30 2 * * *
          months-threshold: 12
      users:
        cron: 0 0 1 * * *
        months-threshold: 12
  security:
    default-role: "USER"
    cookie:
      domain: registry.test.com
      secure: true
      same-site: Lax
    oauth2:
      jwks-uri: ${external.oidc.jwks-uri}
      authorization-uri: ${external.oidc.authorization-uri}
      token-uri: ${external.oidc.token-uri}
      end-session-uri: ${external.oidc.end-session-uri}
      client-id: ${external.oidc.client-id}
      client-secret: ${external.oidc.client-secret}
      claims:
        user-id: "sub"
        email: "email"
        first-name: "given_name"
        last-name: "family_name"
  server:
    logging-level: DEBUG

spring:
  application:
    name: ${registry.information.name}
  flyway:
    schemas: ${registry.datasource.schemas}
    url: jdbc:postgresql://${registry.datasource.base-url}/${registry.datasource.database}
    user: ${registry.datasource.username}
    password: ${registry.datasource.password}
    locations:
      - classpath:db/migrations
  main:
    web-application-type: reactive
    banner-mode: off
  r2dbc:
    url: r2dbc:postgresql://${registry.datasource.base-url}/${registry.datasource.database}?currentSchema=${registry.datasource.schemas}
    username: ${registry.datasource.username}
    password: ${registry.datasource.password}
    pool:
      enabled: true
      initial-size: 1
      max-size: 4
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${registry.security.oauth2.jwks-uri}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${registry.feature.documentation.enabled:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${registry.feature.documentation.enabled:false}
    oauth:
      client-id: ${registry.security.oauth2.client-id}
      client-secret: ${registry.security.oauth2.client-secret}
