external:
  frontend:
    base-url: https://test.frontend.com
  keycloak:
    base-url: https://test.oidc.com
    client-id: client-test
    client-secret: secret-test
    realm: test
    swagger:
      client-id: client-swagger
      client-secret: client-swagger-secret

registry:
  information:
    name: Registry Test
    description: This is the Registry Test application instance.
    locale:
      default: en-US
      supported: en-US, fr-FR
    support:
      name: John DOE
      email: john.doe@test.com
      url: https://test.com
  feature:
    documentation:
      enabled: true
    profile:
      searched:
        max-user-result: 1
    participant:
      searched:
        max-user-result: 1
        max-group-result: 1
    group:
      searched:
        max-participant-result: 1
    movement:
      searched:
        max-participant-result: 1
        max-group-result: 1
        max-vehicle-result: 1
  security:
    default-role: "USER"
    oauth2:
      base-url: ${external.keycloak.base-url}
      realm: ${external.keycloak.realm}
      client-id: ${external.keycloak.swagger.client-id}
      client-secret: ${external.keycloak.swagger.client-secret}
      url: ${registry.security.oauth2.base-url}/realms/${registry.security.oauth2.realm}/protocol/openid-connect
      claims:
        user-id: "sub"
        email: "email"
        first-name: "given_name"
        last-name: "family_name"
  server:
    logging-level: INFO
    prefix: /api

spring:
  application:
    name: ${registry.information.name}
  flyway:
    schemas: ${registry.datasource.schemas}
    url: jdbc:postgresql://${registry.datasource.base-url}/${registry.datasource.database}
    user: ${registry.datasource.username}
    password: ${registry.datasource.password}
    locations:
      - classpath:db/migrations
  main:
    web-application-type: reactive
    banner-mode: off
  r2dbc:
    url: r2dbc:pool:postgresql://${registry.datasource.base-url}/${registry.datasource.database}?currentSchema=${registry.datasource.schemas}
    username: ${registry.datasource.username}
    password: ${registry.datasource.password}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${registry.security.oauth2.url}/certs

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${registry.feature.documentation.enabled:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${registry.feature.documentation.enabled:false}
    oauth:
      client-id: ${registry.security.oauth2.client-id}
      client-secret: ${registry.security.oauth2.client-secret}
