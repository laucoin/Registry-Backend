error.title.401                                                     = 😰 Tu n’es pas connecté
error.title.403                                                     = 👮 Action interdite
error.title.404                                                     = 🧐 Introuvable
error.title.405                                                     = 🤔 Méthode non autorisée
error.title.408                                                     = ⌚ Traitement trop long
error.title.409                                                     = 🤯 Conflit
error.title.413                                                     = 🫣 Requête trop volumineuse
error.title.414                                                     = 🫣 URI trop longue
error.title.415                                                     = 😇 Type de fichier non supporté
error.title.420                                                     = 🚣 Mauvaise connexion
error.title.422                                                     = 😅 Données non-traitables
error.title.423                                                     = 🔒 Verrouillé
error.title.424                                                     = 😱 Erreur d’une dépendance externe
error.title.429                                                     = 🤿 Trop de requêtes
