error.message.400                                                  = Oups ! On dirait que votre demande n'est pas correcte. Vérifies et réessayes.
error.message.401                                                  = Tu n'es pas connecté ! Connectes-toi pour continuer.
error.message.403                                                  = Désolé, tu n'as pas la permission d'accéder à cela. Contactes un admin si besoin.
error.message.404                                                  = Hmm... On ne trouve pas ce que tu cherches. Tu es sûr(e) de l'adresse ?
error.message.405                                                  = Oups ! Cette action n'est pas autorisée. Essayes une autre méthode.
error.message.408                                                  = Cela prend plus de temps que prévu. Essayes de rafraîchir ou reviens plus tard.
error.message.409                                                  = Il y a un conflit avec les données. Assures-toi que tout est à jour.
error.message.413                                                  = Oula ! Votre demande est trop volumineuse. Essayes de réduire la taille.
error.message.414                                                  = Cette URL est vraiment longue ! Essayes d'en utiliser une plus courte.
error.message.415                                                  = Oups ! Ce type de fichier n'est pas pris en charge. Essayes un autre format.
error.message.420                                                  = Votre connexion semble un peu faible. Vérifies ton réseau et réessayes.
error.message.422                                                  = Impossible de traiter ces données. Vérifies-les et tentes à nouveau.
error.message.424                                                  = Un problème est survenu avec un système externe. Réessayes un peu plus tard.
error.message.429                                                  = Doucement ! Tu fais trop de demandes. Patientes un moment et recommences.
error.message.500                                                  = Quelque chose a cassé de notre côté. On s'en occupe ! Reviens dans un instant.
error.message.501                                                  = Cette fonctionnalité n'est pas encore disponible, mais c'est prévu bientôt !

