error.message.400                                                = Oups ! On dirait que votre demande n'est pas correcte. Vérifiez et réessayez.
error.message.401                                                = Vous n'êtes pas connecté ! Connectez-vous pour continuer.
error.message.403                                                = Désolé, vous n'avez pas la permission d'accéder à cela. Contactez un admin si besoin.
error.message.404                                                = Hmm... On ne trouve pas ce que vous cherchez. Vous êtes sûr(e) de l'adresse ?
error.message.405                                                = Oups ! Cette action n'est pas autorisée. Essayez une autre méthode.
error.message.408                                                = Cela prend plus de temps que prévu. Essayez de rafraîchir ou revenez plus tard.
error.message.409                                                = Il y a un conflit avec les données. Assurez-vous que tout est à jour.
error.message.413                                                = Oula ! Votre demande est trop volumineuse. Essayez de réduire la taille.
error.message.414                                                = Cette URL est vraiment longue ! Essayez d'en utiliser une plus courte.
error.message.415                                                = Oups ! Ce type de fichier n'est pas pris en charge. Essayez un autre format.
error.message.420                                                = Votre connexion semble un peu faible. Vérifiez votre réseau et réessayez.
error.message.422                                                = Impossible de traiter ces données. Vérifiez-les et tentez à nouveau.
error.message.424                                                = Un problème est survenu avec un système externe. Réessayez un peu plus tard.
error.message.429                                                = Doucement ! Vous faites trop de demandes. Patientez un moment et recommencez.
error.message.500                                                = Quelque chose a cassé de notre côté. On s'en occupe ! Revenez dans un instant.
error.message.501                                                = Cette fonctionnalité n'est pas encore disponible, mais c'est prévu bientôt !

error.message.NOT_IMPLEMENTED_YET                                = La fonctionnalité n'est pas encore prête… Patience, c'est en chemin ! 🚧
error.message.NO_PARAMETER_FOUND_FOR_SPECIFIED_NAME              = Impossible de valider un paramètre… Il semble s'être caché car il est introuvable. 😅
error.message.COMPARING_WRONG_PARAMETER_TYPE                     = Comparer "{0}" et "{1}" ? Impossible, ils ne parlent même pas le même type !
error.message.NOT_FOUND_WITH_GIVEN_IDENTIFIER                    = Rien trouvé avec l''identifiant "{0}". Tu es sûr qu''il existe ? 🤔
error.message.INVALID_TOKEN                                      = Ton token est invalide ou périmé. Tu devrais le rafraîchir ! 🔄
error.message.NOT_AUTHENTICATED                                  = Ah, tu n'es pas connecté. Connecte-toi pour continuer !
error.message.FAILED_TO_LOGIN_FOR_UNKNOWN_REASON                 = Fichtre ! Bon bah j'ai pas trop compris mais c'est pété. Réessaies plus tard ou contactes l'administrateur.
error.message.NOT_ENOUGH_PERMISSION                              = Pas de bol, tu n'as pas les droits pour ça. Essaie avec un peu plus de droit ! 💪
error.message.PARAMETER_TYPE_MISMATCH                            = Un paramètre est incorrect 🤷
error.message.NOT_ACCEPTED_LANGUAGE_HEADER                       = La langue spécifiée dans "Accept-Language" n''est pas acceptée. Langues disponibles : {0}. À toi de jouer ! 🌍
error.message.UNKNOWN_ERROR                                      = Une erreur inconnue est survenue: "{0}". Désolé, je ne peux pas te donner plus d''information ! 🤷

error.message.AUTH_EMAIL_OR_ID_NOT_FOUND_IN_TOKEN                = L'email ou l'ID utilisateur est introuvable dans le token. Demande à ton admin de t'aider ! 🕵️‍♂️
error.message.AUTH_BLOCKED_ACCOUNT                               = Tu as du faire une bétise, ton compte est bloqué. Pas top, non ? 😕
error.message.AUTH_IMPERSONATED_ACCOUNT                          = Ton compte a été anonymisé. Impossible de te connecter…
error.message.REDIRECT_URI_BLANK                                 = L'URL de redirection ne peut pas être vide. Et oui, c'est indispensable ! 🌐
error.message.AUTHORIZATION_CODE_BLANK                           = Le code d'authentification est vide. Tente une meilleure approche. 🤔
error.message.AUTHORIZATION_CODE_OUTDATED                        = Ton code d'authentification est périmé. Retour à la case départ ! 🔄
error.message.REFRESH_TOKEN_BLANK                                = Le token de rafraîchissement est vide. Impossible d'avancer. 🚫
error.message.REFRESH_TOKEN_OUTDATED                             = Ton token de rafraîchissement est périmé. Retour à la case départ ! 🔄
error.message.AUTH_PROVIDER_FAILED                               = Le fournisseur d'authentification a eu un problème inattendu. C'est balo, non ? 🤷

error.message.USER_ASSIGNS_ROLE_HIGHER_THAN_ITS_OWN              = Sérieusement ? Tu ne peux pas attribuer un rôle "{0}" supérieur au tien.
error.message.USER_UPDATE_LAST_APPLICATION_ADMINISTRATOR_ROLE    = Impossible de modifier le dernier admin. Une application avec un admin foireux, c'est risqué ! 🤯
error.message.USER_BLOCK_LAST_APPLICATION_ADMINISTRATOR          = Bloquer le dernier admin ? Mauvaise idée, crois-moi. 🔒
error.message.USER_IMPERSONATE_LAST_APPLICATION_ADMINISTRATOR    = Impossible d'anonymiser le dernier admin. Une application avec un admin foireux, c'est risqué ! 🤯
error.message.USER_DELETE_LAST_APPLICATION_ADMINISTRATOR         = Supprimer le dernier admin ? Tu veux vraiment tout casser ? ⛓️‍💥
error.message.USER_BLOCK_LAST_EVENT_ADMINISTRATOR                = Bloquer le dernier admin de "{0}" ? Ça risque pas d''aider son administration. 🔒
error.message.USER_BLOCK_CURRENT_USER                            = Sans aucun jugement mais bloquer ton propre compte, c'est pas l'idée du siècle. 🔒
error.message.USER_IMPERSONATE_CURRENT_USER                      = Impossible d'anonymiser ton compte de cette façon. Passes par les préférences. 🕵️‍♂️
error.message.USER_DELETE_CURRENT_USER                           = Sans aucun jugement mais supprimer ton propre compte, c'est pas l'idée du siècle 🤯. Si tu veux quitter l'application passe par les préférences et anonymise ton compte. Il sera automatique supprimé plus tard.
error.message.USER_IMPERSONATE_LAST_EVENT_ADMINISTRATOR          = Impossible d''anonymiser le dernier admin de "{0}". Un évènement avec un admin foireux, c''est moins pratique ! 🤯
error.message.USER_DELETE_LAST_EVENT_ADMINISTRATOR               = Supprimer le dernier admin de "{0}" ? Tu veux vraiment casser l''évènement ? ⛓️‍💥

error.message.EVENT_NAME_NULL_OR_BLANK                           = Non, non, non ! tu ne m'auras pas. Un nom vide ça ne fonctionne pas !
error.message.EVENT_NAME_TOO_LONG                                = T''as vu la longueur du nom 🤯 ? Abuses pas ! Ici le max c''est {0}.
error.message.EVENT_BEGIN_LATER_THAN_END_TIME                    = La date de fin avant celle de début ? Tu as une machine à remonter le temps ? 🕰️
error.message.EVENT_OPTIONS_MISSING                              = L''option "{0}" sans "{1}" ça risque d''être complexe.
error.message.EVENT_DATE_CONFLICT_WITH_ELEMENTS                  = Alors oui mais non… Tu peux modifier les dates de l''évènement. Mais là, ça coince avec un élément déjà créé dans l''évèment "{0}" ! 🤔

error.message.EVENT_PROFILE_ROLE_BLANK                           = Pas de rôle de profile ! Le rôle du profil de l'événement ne peut pas être vide.
error.message.EVENT_PROFILE_ACCESS_OUT_OF_EVENT_DATE_RANGE       = Les dates d''accès à l''événement via le profile ({0} au {1}) sont hors de l''événement ({2} au {3}). Ajuste-les !
error.message.EVENT_PROFILE_START_ACCESS_LATER_THAN_END_ACCESS   = La date de fin d'accès ne peut pas être avant celle de début. On ne remonte pas le temps ! 🕰️
error.message.EVENT_PROFILE_USERS_EMPTY                          = Impossible de créer des profils sans utilisateur. Il en faut au moins un !
error.message.EVENT_PROFILE_STATUS_NOT_ACCEPTED_OR_REJECTED      = Le statut du profil doit être accepté ou rejeté. Pas de compromis ici !
error.message.EVENT_PROFILE_UPDATE_LAST_EVENT_ADMINISTRATOR      = Impossible de modifier le dernier admin de l''événement "{0}". On garde au moins une personne responsable ! 👮
error.message.EVENT_PROFILE_DELETE_LAST_EVENT_ADMINISTRATOR      = Supprimer le dernier admin de "{0}" ? Tu veux vraiment casser l''évènement ? ⛓️‍💥
error.message.EVENT_PROFILE_UPDATE_ROLE_HIGHER_THAN_CURRENT_USER = Tu n''as pas les droit pour assigner le rôle "{0}", désolé ! 🤷
error.message.EVENT_PROFILE_ALREADY_EXIST_ON_RANGE               = Un profil existe déjà pour le ou les utilisateurs sur une partie de la période renseignée. Pas de doublons, merci ! 🚫

error.message.MOVEMENT_DATETIME_NULL                             = L'horodatage du mouvement doivent être définies. Sinon, comment savoir quand ça se passe ?
error.message.MOVEMENT_DATETIME_OUT_OF_EVENT_DATE_RANGE          = L''horodatage du mouvement "{0}" est hors de celles de l''événement ({1} au {2}). Restons dans les clous !
error.message.MOVEMENT_TYPE_NULL                                 = Le type de mouvement doit être défini. Sinon je risque d'avoir du mal à te dire s''il s''agit d''une entrée ou d''une sortie la prochaine fois que tu me demandes.
error.message.MOVEMENT_CONTENT_EMPTY                             = Impossible de créer un mouvement sans participants. Reviens avec une équipe !
error.message.MOVEMENT_CONTENT_PARTICIPANT_ID_NULL               = Un participant du mouvement n'est pas spécifié.
error.message.MOVEMENT_PARTICIPANTS_NOT_FOUND_IN_MOVEMENT_EVENT  = Un participant du mouvement est introuvable dans l'événement. Où est-il passé ? 🤔
error.message.MOVEMENT_PARTICIPANTS_NOT_VISIBLE                  = Un participant du mouvement est désactivé. Peut-être une mise à jour à faire ?

error.message.PARTICIPANT_FIRST_NAME_NULL_OR_BLANK               = Non, non, non ! tu ne m'auras pas. Un prénom vide ça ne fonctionne pas !
error.message.PARTICIPANT_FIRST_NAME_TOO_LONG                    = Le prénom de la personne participante est trop long. Abuses pas ! Ici le max c''est {0} .
error.message.PARTICIPANT_LAST_NAME_NULL_OR_BLANK                = Non, non, non ! tu ne m'auras pas. Un nom vide ça ne fonctionne pas !
error.message.PARTICIPANT_LAST_NAME_TOO_LONG                     = Le nom de la personne participante est trop long. Abuses pas ! Ici le max c''est {0} .
error.message.PARTICIPANT_BIRTHDAY_NULL                          = À priori les gens naissent un jour. Merci de me fournir cette date !
error.message.PARTICIPANT_BIRTHDAY_FUTURE                        = Naître dans le futur ? Pas dans ce monde, désolé !
error.message.PARTICIPANT_START_LATER_THAN_END                   = La date d'arrivé de la personne participante ne peut pas être avant celle du départ. On ne remonte pas le temps ! 🕰️
error.message.PARTICIPANT_PRESENCE_DATES_OUT_OF_EVENT_DATE_RANGE = Les dates de présence de la personne participante ({0} au {1}) sont hors de l''événement ({2} au {3}). Ajuste-les !
error.message.PARTICIPANT_IN_EVENT_ALREADY_LINKED_TO_USER        = L''utilisateur est déjà lié au participant "{0}" dans cet événement. Pas de doublons ! 🚫
error.message.PARTICIPANT_GROUPS_NOT_FOUND_IN_PARTICIPANT_EVENT  = Un groupe de la personne participante est introuvable dans l'événement. Il a dû se perdre… 🤔
error.message.PARTICIPANT_GROUPS_NOT_VISIBLE                     = Un groupe de la personne participante est désactivé. Vérifie ça !
error.message.PARTICIPANT_DISABLE_LAST_GROUP_MEMBER              = Impossible de masquer le dernier membre d'un groupe. Un groupe sans membre, c'est moins pratique ! 🤯
error.message.PARTICIPANT_DELETE_LAST_GROUP_MEMBER               = Impossible de supprimer le dernier membre d'un groupe. Un groupe sans membre, c'est moins pratique ! 🤯

error.message.GROUP_NAME_NULL_OR_BLANK                           = Non, non, non ! tu ne m'auras pas. Un nom vide ça ne fonctionne pas !
error.message.GROUP_NAME_TOO_LONG                                = T''as vu la longueur du nom 🤯 ? Abuses pas ! Ici le max c''est {0}.
error.message.GROUP_START_LATER_THAN_END                         = La date d'arrivé du groupe ne peut pas être avant celle du départ. On ne remonte pas le temps ! 🕰️
error.message.GROUP_PRESENCE_DATES_OUT_OF_EVENT_DATE_RANGE       = Les dates de présence du groupe ({0} au {1}) sont hors de l''événement ({2} au {3}). Ajuste-les !
error.message.GROUP_MEMBERS_EMPTY                                = Impossible de créer un groupe sans membres. Ce groupe a besoin de renforts !
error.message.GROUP_MEMBERS_NOT_FOUND_IN_GROUP_EVENT             = Un membre du groupe est introuvable dans l'événement. Je crois que tu veux m'embrouiller !
error.message.GROUP_MEMBERS_ALREADY_ADDED                        = Un membre du groupe est déjà ajouté. Pas besoin de le dupliquer !
error.message.GROUP_MEMBERS_NOT_VISIBLE                          = Un membre du groupe est désactivé. Réactive-le pour continuer !
error.message.GROUP_LAST_MEMBERS_CANNOT_BE_REMOVED               = Impossible de retirer le dernier membre du groupe. Il faut au moins quelqu'un !
