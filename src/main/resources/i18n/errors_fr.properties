error.message.400=On dirait que votre requ\u00EAte est invalide (Cela peut \u00EAtre due \u00E0 des donn\u00E9es invalides ou manquantes). V\u00E9rifie les informations et r\u00E9essayes\u00A0?.
error.message.401=Connectes-toi\u00A0! Si c\u2019est d\u00E9j\u00E0 le cas essayes de reconnecter\u00A0\uD83D\uDD10.
error.message.403=Tu n\u2019as pas la permission d\u2019acc\u00E9der \u00E0 cette ressource\u00A0\uD83D\uDEAB. Contactes l\u2019administrateur de ton projet si besoin.
error.message.404=Hmm\u00A0? On ne trouve pas ce que tu cherches\u00A0?. Tu es sûr(e) de son existence\u00A0?
error.message.405=La m\u00E9thode utilis\u00E9e n\u2019est pas support\u00E9e. Essayes une autre m\u00E9thode\u00A0\uD83D\uDED1.
error.message.408=Cela prend plus de temps que pr\u00E9vu\u00A0\u23F3. Essayes de rafra\u00EEchir ou reviens plus tard.
error.message.409=Il y a un conflit. V\u00E9rifies les donn\u00E9es envoy\u00E9es et r\u00E9essayes\u00A0\u26A0\uFE0F.
error.message.413=Oula\u00A0! Votre demande est trop volumineuse\u00A0\uD83D\uDC33. Essayes de r\u00E9duire la taille.
error.message.414=L\u2019URL est trop longue. Raccourcis-la et r\u00E9essayes\u00A0\uD83D\uDD17.
error.message.415=Le format de fichier envoy\u00E9 n\u2019est pas pris en charge\u00A0\uD83D\uDCC2. Utilises un format support\u00E9\u00A0!
error.message.420=Ta connexion est faible\u00A0?, rapproches toi de la box. Si tu es en 4G, rapproches toi d\u2019une fen\u00EAtre. Si tu es en 3G, rapproches toi d\u2019un autre si\u00E8cle.
error.message.422=Les donn\u00E9es envoy\u00E9es sont incompl\u00E8tes ou incorrectes\u00A0\uD83D\uDCCB. V\u00E9rifies-les et r\u00E9essayes\u00A0!
error.message.424=Une d\u00E9pendance externe n\u00E9cessaire a plant\u00E9. R\u00E9essayes plus tard\u00A0\uD83D\uDD04.
error.message.429=Tu as envoy\u00E9 trop de requ\u00EAtes en peu de temps. Essayes de nouveau plus tard\u00A0\uD83D\uDD70\uFE0F.
error.message.500=Une erreur inattendue est survenue, nous travaillons \u00E0 la r\u00E9soudre\u00A0\uD83D\uDEE0\uFE0F. Si l\u2019erreur persiste n\u2019h\u00E9sites pas \u00E0 nous remonter cette erreur.
error.message.501=Cette fonctionnalit\u00E9 n\u2019est pas encore disponible. Patientes un peu\u00A0\u23F3 c\u2019est pr\u00E9vu pour bient\u00F4t\u00A0!
error.message.NOT_IMPLEMENTED_YET=Cette fonctionnalit\u00E9 n\u2019est pas encore disponible. Patientes un peu \u23F3 c\u2019est pr\u00E9vu pour bient\u00F4t !
error.message.NO_PARAMETER_FOUND_FOR_SPECIFIED_NAME=Impossible de v\u00E9rifier une donn\u00E9e… elle est introuvable\u00A0\uD83D\uDD75\uFE0F\u200D\u2642\uFE0F.
error.message.COMPARING_WRONG_PARAMETER_TYPE=Impossible de comparer des carottes\u00A0\uD83E\uDD55 et des entrec\u00F4tes\u00A0\uD83E\uDD69. Les param\u00E8tres (\u201C{0}\u201D et \u201C{1}\u201D) ne sont pas comparables.
error.message.NOT_FOUND_WITH_GIVEN_IDENTIFIER=Hmm\u00A0? On ne trouve rien avec l\u2019identifiant \u201D{0}\u201C\u00A0?. Tu es sûr(e) de son existence\u00A0?
error.message.INVALID_TOKEN=Ton jeton d\u2019authentification est invalide ou p\u00E9rim\u00E9. Tu devrais le rafra\u00EEchir\u00A0!\u00A0\uD83D\uDD04
error.message.NOT_AUTHENTICATED=Connectes-toi\u00A0! Si c\u2019est d\u00E9j\u00E0 le cas essayes de reconnecter\u00A0\uD83D\uDD10.
error.message.FAILED_TO_LOGIN_FOR_UNKNOWN_REASON=Fichtre ! Une erreur inconnue est survenue durant la connexion\u00A0?. R\u00E9essaye plus tard ou contactes l\u2019administrateur.
error.message.NOT_ENOUGH_PERMISSION=Tu n\u2019as pas les droits\u00A0! Tu peux demander de l\u2019aide \u00E0 Chuck Norris pour forcer le passage mais je doute que \u00E7a suffise.\u00A0\uD83D\uDE0F
error.message.PARAMETER_TYPE_MISMATCH=Tu m\u2019as envoy\u00E9 une entrec\u00F4te\u00A0\uD83E\uDD69 alors que j\u2019attendais des carottes\u00A0\uD83E\uDD55. Le type de donn\u00E9e est incorrecte.
error.message.DATE_IS_NULL=Si tu m\u2019envoies un horodatage\u00A0\uD83D\uDCC6, il faut au moins que la date soit d\u00E9finie.
error.message.TIME_IS_SET_BUT_NOT_DATE=Si tu m?envoies un horodatage\u00A0?. l\u2019heure ne peut pas \u00EAtre d\u00E9finit sans date. C\u2019est comme si je te donne rendez-vous \u00E0 15h30 sans pr\u00E9ciser le jour, tu vois le souci\u00A0?
error.message.PAGE_SIZE_IS_LOWER_THAN_ONE=Tu viens d\u2019inventer la pagination quantique\u00A0\uD83D\uDC4F. Cette page existe et n\u2019existe pas en m\u00EAme temps. Tu te rends bien compte qu\u2019une page avec une taille inf\u00E9rieure \u00E0 1 c\u2019est compliqu\u00E9 \u00E0 calculer\u00A0?
error.message.PAGE_SIZE_IS_UPPER_THAN_MAX_PAGE_SIZE=On t\u2019envoie des pages, pas des encyclop\u00E9dies\u00A0?! La taille maximum d\u2019une page C\u2019est \u201D{0}\u201C.
error.message.PAGE_NUMBER_IS_LOWER_THAN_ZERO=Erreur 404\u00A0? Non, erreur\u00A0-404 ! Un num\u00E9ro de page n\u00E9gatif\u00A0?
error.message.UNKNOWN_ERROR=Une erreur inattendue est survenue, nous travaillons \u00E0 la r\u00E9soudre\u00A0\uD83D\uDEE0\uFE0F. Si l\u2019erreur persiste n\u2019h\u00E9sites pas \u00E0 nous remonter cette erreur.
error.message.AUTH_EMAIL_OR_ID_NOT_FOUND_IN_TOKEN=Impossible de r\u00E9cup\u00E9rer les informations n\u00E9cessaires \u00E0 la connexion aupr\u00E8s du tiers\u00A0\uD83D\uDD75\uFE0F\u200D\u2642\uFE0F.
error.message.AUTH_BLOCKED_ACCOUNT=Ton compte a \u00E9t\u00E9 bloqu\u00E9. Rapproches-toi d\u2019un administrateur pour avoir des informations suppl\u00E9mentaires\u00A0\uD83D\uDCAC.
error.message.AUTH_IMPERSONATED_ACCOUNT=Ton compte a \u00E9t\u00E9 anonymis\u00E9\u00A0\uD83E\uDDFD. Il est donc impossible de te connecter.
error.message.AUTH_EMAIL_ALREADY_USED=l\u2019adresse e-mail {0} est d\u00E9j\u00E0 utilis\u00E9e par un autre compte. Si tu penses que C\u2019est une erreur, contactes l\u2019administrateur de ton projet.
error.message.REDIRECT_URI_BLANK=L\u2019URL de redirection ne peut pas \u00EAtre vide. Et oui, c\u2019est indispensable\u00A0!\u00A0\uD83C\uDF10
error.message.AUTHORIZATION_CODE_BLANK=Le code permettant d\u2019obtenir un jeton d\u2019authentification est vide\u00A0\uD83E\uDD14. Sans code pas de jeton\u00A0! Si le probl\u00E8me persiste reconnectes toi.
error.message.AUTHORIZATION_CODE_OUTDATED=Le code permettant d\u2019obtenir un jeton d\u2019authentification est p\u00E9rim\u00E9\u00A0\uD83E\uDD14. Sans code valide pas de jeton ! Si le probl\u00E8me persiste reconnectes toi.
error.message.REFRESH_TOKEN_OUTDATED=Le code permettant de renouveler le jeton d\u2019authentification est p\u00E9rim\u00E9\u00A0?. Sans code valide pas de jeton ! Si le probl\u00E8me persiste reconnectes toi.
error.message.AUTH_PROVIDER_FAILED=Le tiers permettant de te connecter a rencontr\u00E9 une erreur inattendue. Malheureusement, sans lui tu n\u2019es pas connect\u00E9 et sans connexion pas d\u2019acc\u00E8s\u00A0?.
error.message.USER_ASSIGNS_ROLE_HIGHER_THAN_ITS_OWN=Le r\u00F4le \u201D{0}\u201C est sup\u00E9rieur au tien\u00A0?. Tu ne peux donc pas l\u2019assigner.
error.message.USER_UPDATE_LAST_APPLICATION_ADMINISTRATOR_ROLE=Tu es entrain de modifier le r\u00F4le du dernier administrateur de l\u2019application\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer l\u2019application (et j\u2019ai la flemme) donc non.
error.message.USER_BLOCK_LAST_APPLICATION_ADMINISTRATOR=Tu es entrain de bloquer le dernier administrateur de l\u2019application \uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer l\u2019application (et j\u2019ai la flemme) donc non.
error.message.USER_IMPERSONATE_LAST_APPLICATION_ADMINISTRATOR=Tu es entrain d\u2019anonymiser le dernier administrateur de l\u2019application\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer l\u2019application (et j\u2019ai la flemme) donc non. Si tu veux vraiment faire \u00E7a, tu peux nommer un autre administrateur et ainsi tu pourras r\u00E9essayer d\u2019anonymiser celui-ci.
error.message.USER_DELETE_LAST_APPLICATION_ADMINISTRATOR=Tu es entrain de supprimer le dernier administrateur de l\u2019application\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer l\u2019application (et j\u2019ai la flemme) donc non. Si tu veux vraiment faire \u00E7a, tu peux nommer un autre administrateur et ainsi tu pourras r\u00E9essayer d\u2019anonymiser celui-ci.
error.message.USER_BLOCK_LAST_PROJECT_ADMINISTRATOR=Tu es entrain de bloquer le dernier administrateur permanent du projet \u201C{0}\u201D\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le projet (et j\u2019ai la flemme) donc non.
error.message.USER_BLOCK_CURRENT_USER=Je ne me permettrai pas de te juger mais bloquer ton compte ce n\u2019est pas l\u2019id\u00E9e du si\u00E8cle\u00A0?.
error.message.USER_IMPERSONATE_CURRENT_USER=Impossible d\u2019anonymiser ton compte de cette fa\u00E7on. Passes par les param\u00E8tres.\u00A0\uD83D\uDD75\uFE0F\u200D\u2642\uFE0F
error.message.USER_DELETE_CURRENT_USER=Tu ne peux pas supprimer ton compte, par contre tu peux l\u2019anonymiser pour effacer toutes les donn\u00E9es qui te sont li\u00E9es.
error.message.USER_IMPERSONATE_LAST_PROJECT_ADMINISTRATOR=Tu es entrain d\u2019anonymiser le dernier administrateur du projet \u201C{0}\u201D\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le projet (et j\u2019ai la flemme) donc non. Si tu veux vraiment faire \u00E7a, tu peux nommer un autre administrateur OU supprimer le projet et ainsi tu pourras r\u00E9essayer d\u2019anonymiser celui-ci.
error.message.USER_DELETE_LAST_PROJECT_ADMINISTRATOR=Tu es entrain de supprimer le dernier administrateur du projet \u201C{0}\u201D\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le projet (et j\u2019ai la flemme) donc non. Si tu veux vraiment faire \u00E7a, tu peux nommer un autre administrateur OU supprimer le projet et ainsi tu pourras r\u00E9essayer de supprimer celui-ci.
error.message.PROJECT_NAME_NULL_OR_BLANK=Le projet doit obligatoirement avoir un nom. N\u2019est-ce pas plus pratique pour savoir duquel on parle\u00A0?\u00A0\uD83D\uDE05
error.message.PROJECT_NAME_TOO_LONG=Le nom de ton projet est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.PROJECT_BEGIN_LATER_THAN_END_TIME=Ton projet ne peut d\u00E9cemment pas finir avant d\u2019avoir d\u00E9but\u00E9\u00A0\uD83D\uDE2C. Si tu y arrives c\u2019est que tu as une machine \u00E0 remonter le temps\u00A0\uD83D\uDD70\uFE0F.
error.message.PROJECT_OPTIONS_MISSING=Il manque une option sur ton projet. Pour activer \u201C{0}\u201D, il te faut absolument \u201C{1}\u201D. Sinon l\u2019application ne va pas aimer\u00A0\uD83E\uDD2F.
error.message.PROJECT_DATE_CONFLICT_WITH_ELEMENTS=Les nouvelles dates du projet \u201D{0}\u201C sont en conflit au moins avec un \u00E9l\u00E9ment existant\u00A0?. Tu peux modifier les dates de ton projet mais dans la limite des \u00E9l\u00E9ments d\u00E9j\u00E0 cr\u00E9\u00E9s. Sinon il faut les supprimer.
error.message.PROJECT_PROFILE_ROLE_BLANK=Un profil d\u2019acc\u00E8s \u00E0 un projet doit obligatoirement avoir un r\u00F4le sp\u00E9cifi\u00E9. Pas de r\u00F4le, pas de profil.
error.message.PROJECT_PROFILE_START_ACCESS_LATER_THAN_END_ACCESS=l\u2019acc\u00E8s au profil ne peut d\u00E9cemment pas finir avant d\u2019avoir d\u00E9but\u00A0?. Si tu y arrives C\u2019est que tu as une machine \u00E0 remonter le temps\u00A0?.
error.message.PROJECT_PROFILE_USERS_EMPTY=Tu veux cr\u00E9er un ou plusieurs profils d\u2019acc\u00E8s \u00E0 un projet. Mais pour cela tu dois obligatoirement pr\u00E9ciser pour quels utilisateurs\u00A0\uD83E\uDDD1\u200D\uD83D\uDCBB tu veux les cr\u00E9er.
error.message.PROJECT_PROFILE_STATUS_NOT_ACCEPTED_OR_REJECTED=Pour accepter ou refuser un profil, il faut que tu envois le bon statut\u00A0?.
error.message.PROJECT_PROFILE_BLOCK_LAST_PROJECT_ADMINISTRATOR=Tu es entrain de bloquer le dernier administrateur du projet \u201C{0}\u201D\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le projet (et j\u2019ai la flemme) donc non.
error.message.PROJECT_PROFILE_DELETE_LAST_PROJECT_ADMINISTRATOR=Tu es entrain de supprimer le dernier administrateur du projet \u201C{0}\u201D\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le projet (et j\u2019ai la flemme) donc non. Si tu veux vraiment faire \u00E7a, tu peux nommer un autre administrateur OU supprimer le projet et ainsi tu pourras r\u00E9essayer de supprimer celui-ci.
error.message.PROJECT_PROFILE_UPDATE_LAST_PROJECT_ADMINISTRATOR=Tu changes le r\u00F4le du dernier administrateur du projet \u201D{0}\u201C\u00A0?. Si je te laisse faire, je fais devoir r\u00E9parer le projet (et j?ai la flemme) donc non.
error.message.PROJECT_PROFILE_UPDATE_ROLE_HIGHER_THAN_CURRENT_USER=Tu ne peux pas mettre \u00E0 jour un profil ayant un r\u00F4le plus \u00E9lev\u00E9 que le tien\u00A0?.
error.message.PROJECT_PROFILE_ASSIGNS_ROLE_HIGHER_THAN_CURRENT_USER=Le r\u00F4le \u201C{0}\u201D est sup\u00E9rieur \u00E0 celui de ton profil\u00A0\uD83E\uDEE1. Tu ne peux donc pas l\u2019assigner.
error.message.PROJECT_PROFILE_ALREADY_EXIST_ON_RANGE=Un profil existe d\u00E9j\u00E0 pour au moins un utilisateur sur la p\u00E9riode sp\u00E9cifi\u00E9e. Pour \u00E9viter de perdre en clart\u00E9, il n\u2019est pas possible qu\u2019une personne ait plus d\u2019un profil sur la m\u00EAme p\u00E9riode\u00A0?.
error.message.PARTICIPANT_FIRST_NAME_NULL_OR_BLANK=Le participant doit obligatoirement avoir un pr\u00E9nom. N\u2019est-ce pas plus pratique pour l\u2019appeler\u00A0?\u00A0\uD83D\uDE05
error.message.PARTICIPANT_FIRST_NAME_TOO_LONG=Le pr\u00E9nom du participant est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.PARTICIPANT_LAST_NAME_NULL_OR_BLANK=Le participant doit obligatoirement avoir un nom de famille. Tout le monde en a un non\u00A0?\u00A0\uD83D\uDE05
error.message.PARTICIPANT_LAST_NAME_TOO_LONG=Le nom de famille du participant est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.PARTICIPANT_BIRTHDAY_NULL=Le participant doit obligatoirement avoir une date de naissance. Tout le monde en a une non\u00A0?\u00A0\uD83D\uDE05
error.message.PARTICIPANT_BIRTHDAY_FUTURE=C\u2019est peut-\u00EAtre pas tr\u00E9s inclusif mais on n\u2019accepte que les participants qui sont d\u00E9j\u00E0 n\u00E9s\u00A0?. Ne fait pas de scandale, les femmes enceintes sont les bienvenues, C\u2019est juste que les dates de naissance dans le futur moins.
error.message.PARTICIPANT_START_LATER_THAN_END=La date d\u00E9part d\u2019un participant ne peut d\u00E9cemment pas \u00EAtre avant sa date d\u2019arriv\u00E9e\u00A0?. Si tu y arrives C\u2019est que tu as une machine \u00E0 remonter le temps\u00A0?.
error.message.PARTICIPANT_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=Au moins une date de pr\u00E9sence du participant (\u201D{0}\u201C au \u201D{1}\u201C) est en dehors des dates du projet (\u201D{2}\u201C au \u201D{3}\u201C). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0?. Pour signifier qu\u2019un participant est pr\u00E9sent tout au long du projet, le mieux C\u2019est de ne pas pr\u00E9ciser ses dates de pr\u00E9sence\u00A0?.
error.message.PARTICIPANT_IN_PROJECT_ALREADY_LINKED_TO_USER=l\u2019utilisateur est d\u00E9j\u00E0 li\u00E9 au participant \u201D{0}\u201C dans ce projet. Pas de doublon\u00A0!?
error.message.PARTICIPANT_OUT_OF_MOVEMENT_DATETIME=Les nouvelles dates du participant sont en conflit avec \u201C{0}\u201D mouvement qui lui sont li\u00E9\u00A0\uD83E\uDD2F. Tu peux modifier les dates d\u2019un participant mais dans la limite des mouvements d\u00E9j\u00E0 cr\u00E9\u00E9s. Sinon il faut les supprimer.
error.message.PARTICIPANT_GROUPS_NOT_FOUND_IN_PARTICIPANT_PROJECT=Au moins un groupe du participant est introuvable dans le projet\u00A0?. V\u00E9rifie bien les groupes saisis puis essayes \u00E0 nouveau.
error.message.PARTICIPANT_GROUPS_NOT_VISIBLE=Au moins un groupe du participant est masqu\u00E9. Un groupe masqu\u00E9\u00A0\uD83D\uDE37 ne peut pas \u00EAtre ajout\u00E9 \u00E0 un participant.
error.message.PARTICIPANT_DISABLE_LAST_GROUP_MEMBER=Tu es entrain de masquer le dernier participant d\u2019un groupe\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le groupe (et j\u2019ai la flemme) donc non.
error.message.PARTICIPANT_DELETE_HAS_MOVEMENT=Tu es entrain de supprimer un participant qui a d\u00E9j\u00E0 au moins un mouvement\u00A0?. Si je te laisse faire, on va perdre des informations de l\u2019historique, ce qui n\u2019est pas possible tant que le projet n\u2019est pas fini.
error.message.PARTICIPANT_DELETE_LAST_GROUP_MEMBER=Tu es entrain de supprimer le dernier membre d\u2019un groupe\u00A0\uD83E\uDD2F. Si je te laisse faire, je fais devoir r\u00E9parer le groupe (et j\u2019ai la flemme) donc non. Si tu veux vraiment faire \u00E7a, tu peux supprimer le groupe et r\u00E9essayer\u00A0\uD83D\uDCA1.
error.message.MOVEMENT_DATETIME_NULL=Le mouvement doit obligatoirement avoir un horodatage. N\u2019est-ce pas plus pratique pour savoir quand il a lieu\u00A0?\u00A0\uD83D\uDE05
error.message.MOVEMENT_DATETIME_OUT_OF_PROJECT_DATE_RANGE=L\u2019horodatage du mouvement \u201C{0}\u201D est en dehors des dates du projet (\u201C{1}\u201D au \u201C{2}\u201D). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0\uD83E\uDD2F. Tu peux cr\u00E9er un mouvement li\u00E9 \u00E0 un projet \u00E0 condition que la date de ton mouvement soit incluse dans les dates de ton projet.
error.message.MOVEMENT_TYPE_NULL=Le mouvement doit obligatoirement avoir un type. N\u2019est-ce pas plus pratique pour savoir s\u2019il s\u2019agit d\u2019une entr\u00E9e ou d\u2019une sortie\u00A0?\u00A0\uD83D\uDE05
error.message.MOVEMENT_CONTENT_EMPTY=Le mouvement doit obligatoirement avoir des participants. Sans participant pas de mouvement, si\u00A0?\u00A0\uD83D\uDE05
error.message.MOVEMENT_CONTENT_PARTICIPANT_ID_NULL=Il semble que dans le contenu sp\u00E9cifi\u00E9 pour le mouvement, il manque l\u2019identifiant d\u2019un participant.\u00A0\uD83D\uDC40
error.message.MOVEMENT_ODD_GUEST_CONTENT=Il n\u2019est pas possible de cr\u00E9er des invit\u00E9s pour cr\u00E9er une sortie. En effet, un invit\u00E9 qui sort a forc\u00E9ment du rentrer\u00A0?\u00A0? Donc s\u2019il est bien rentr\u00E9, il faut le faire sortir en donnant son identifiant afin d\u2019\u00E9viter les doublons.
error.message.MOVEMENT_REMOVE_GUEST_CONTENT=Tu as retir\u00E9 au moins un invit\u00E9 en modifiant le mouvement. Ce n\u2019est pas possible\u00A0\u26D4\uFE0F\u00A0! On part du principe que tu as eu les informations pour le faire rentrer c\u2019est qu\u2019il \u00E9tait l\u00E0. Donc tu peux le faire sortir\u00A0\uD83D\uDE09.
error.message.MOVEMENT_PARTICIPANTS_NOT_FOUND_IN_MOVEMENT_PROJECT=Au moins un participant du mouvement est introuvable dans le projet. V\u00E9rifie bien les participants saisis et leurs dates de pr\u00E9sences\u00A0? puis essayes \u00E0 nouveau.
error.message.MOVEMENT_PARTICIPANTS_NOT_VISIBLE=Au moins un participant du mouvement est masqu\u00E9. Un participant masqu\u00E9\u00A0\uD83D\uDE37 ne peut pas \u00EAtre inclus dans un mouvement.
error.message.MOVEMENT_VEHICLES_NOT_FOUND_IN_MOVEMENT_PROJECT=Au moins un v\u00E9hicule du mouvement est introuvable dans le projet. V\u00E9rifie bien les v\u00E9hicules saisis et leurs dates de pr\u00E9sences\u00A0? puis essayes \u00E0 nouveau.
error.message.MOVEMENT_VEHICLES_NOT_VISIBLE=Au moins un v\u00E9hicule du mouvement est masqu\u00E9. Un v\u00E9hicule masqu\u00E9\u00A0\uD83D\uDE37 ne peut pas \u00EAtre inclus dans un mouvement.
error.message.MOVEMENT_TYPE_AND_REASON_ARE_INCOMPATIBLE=Le type et le motif du mouvement sont incompatibles. Pas de motif pour la sortie d\u2019invit\u00E9s ni pour l\u2019entr\u00E9e de participants inscrits. Dans les autres cas un motif est requis et ces derniers ne sont pas commun entre les participants inscrits et les invit\u00E9s\u00A0\uD83E\uDD2F.
error.message.MOVEMENT_ACTIVITY_AND_REASON_ARE_DEFINED=Une activit\u00E9 est par essence un motif de sortie donc tu ne peux pas sp\u00E9cifier une activit\u00E9 ET un motif de sortie\u00A0\uD83D\uDE2C.
error.message.MOVEMENT_ACTIVITY_NOT_FOUND_IN_MOVEMENT_PROJECT=l\u2019activit\u00E9 du mouvement est introuvable dans le projet. V\u00E9rifies bien l\u2019activit\u00E9 saisie et ses dates de pr\u00E9sence\u00A0? puis essayes \u00E0 nouveau.
error.message.MOVEMENT_ACTIVITY_NOT_VISIBLE=l\u2019activit\u00E9 du mouvement est masqu\u00E9e. Une activit\u00E9 masqu\u00E9e\u00A0? ne peut pas \u00EAtre incluse dans un mouvement.
error.message.MOVEMENT_COMMUNICATION_OUT_OF_MOVEMENT_DATETIME=Le nouvel horodatage du mouvement est apr\u00E8s \u201C{0}\u201D communications qui lui sont li\u00E9\u00A0\uD83E\uDD2F. Tu peux modifier l\u2019horodatadage d\u2019un mouvement mais dans la limite des communications d\u00E9j\u00E0 cr\u00E9\u00E9s. Sinon il faut les supprimer.
error.message.MOVEMENT_UPDATE_CHANGE_TYPE=Il n\u2019est pas possible de changer le type d\u2019un mouvement. C\u2019est \u00E0 dire qu\u2019une entr\u00E9e ne peux pas devenir une sortie. Si tu t\u2019es tromp\u00E9, je t\u2019invite \u00E0 masquer/supprimer le mouvement et \u00E0 recr\u00E9er le mouvement dans le bon sens.
error.message.MOVEMENT_UPDATE_CHANGE_CONTENT_TYPE=Il n\u2019est pas possible de changer le type de participant. C\u2019est \u00E0 dire que tu ne peux pas changer de participant inscrit \u00E0 invit\u00E9.
error.message.GROUP_NAME_NULL_OR_BLANK=Le groupe doit obligatoirement avoir un nom. N\u2019est-ce pas plus pratique pour l\u2019identifier sans retenir un identifiant comme \u201Dfcac7e29-f64f-4b18-8ce0-dffe3281b4b6\u201C\u00A0?
error.message.GROUP_NAME_TOO_LONG=Le nom du groupe est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.GROUP_START_LATER_THAN_END=La date d\u00E9part d\u2019un groupe ne peut d\u00E9cemment \u00EAtre avant sa date d\u2019arriv\u00E9e\u00A0\uD83D\uDE2C. Si tu y arrives c\u2019est que tu as une machine \u00E0 remonter le temps\u00A0\uD83D\uDD70\uFE0F.
error.message.GROUP_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=Au moins une date de pr\u00E9sence du groupe (\u201D{0}\u201C au \u201D{1}\u201C) est en dehors des dates du projet (\u201D{2}\u201C au \u201D{3}\u201C). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0?. Pour signifier qu\u2019un groupe est pr\u00E9sent tout au long du projet, le mieux C\u2019est de ne pas pr\u00E9ciser ses dates de pr\u00E9sence\u00A0?.
error.message.GROUP_MEMBERS_EMPTY=Il est impossible de cr\u00E9er un groupe sans membre\u00A0\uD83E\uDDB5. Et de toute fa\u00E7on \u00E7a ne fait aucun sens, si\u00A0?
error.message.GROUP_MEMBERS_NOT_FOUND_IN_GROUP_PROJECT=Au moins un participant est introuvable dans le projet\u00A0\uD83D\uDE48. V\u00E9rifies bien les participants saisis puis essayes \u00E0 nouveau.
error.message.GROUP_MEMBERS_ALREADY_ADDED=Au moins un participant \u00E9t\u00E9 d\u00E9j\u00E0 dans ce groupe\u00A0?. V\u00E9rifie bien les participants saisis puis essayes \u00E0 nouveau.
error.message.GROUP_MEMBERS_NOT_VISIBLE=Au moins un participant est masqu\u00E9. Un participant masqu\u00E9\u00A0\uD83D\uDE37 ne peut pas \u00EAtre ajout\u00E9 dans un groupe.
error.message.GROUP_LAST_MEMBERS_CANNOT_BE_REMOVED=Il est impossible de retirer le dernier membre du groupe. Si tu veux vraiment faire \u00E7a, tu peux supprimer le groupe directement\u00A0\uD83D\uDCA1.
error.message.VEHICLE_LICENSE_PLATE_NULL_OR_BLANK=Le v\u00E9hicule doit obligatoirement avoir une plaque d\u2019immatriculation. C\u2019est obligatoire pour prendre la route de toute fa\u00E7on\u00A0?\u00A0\uD83D\uDE05
error.message.VEHICLE_LICENSE_PLATE_TOO_LONG=La plaque d\u2019immatriculation du v\u00E9hicule est trop longue \uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.VEHICLE_BRAND_NULL_OR_BLANK=Le v\u00E9hicule doit obligatoirement avoir une marque. M\u00EAme si elle est controvers\u00E9e, elle existe quand m\u00EAme\u00A0?
error.message.VEHICLE_BRAND_TOO_LONG=Le nom de la marque du v\u00E9hicule est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.VEHICLE_MODEL_NULL_OR_BLANK=Le v\u00E9hicule doit obligatoirement avoir un mod\u00E8le. M\u00EAme si c\u2019est un multiplat, on l\u2019accepte.\u00A0\uD83D\uDE05
error.message.VEHICLE_MODEL_TOO_LONG=Le nom du mod\u00E8le du v\u00E9hicule est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.VEHICLE_START_LATER_THAN_END=La date d\u00E9part d\u2019un v\u00E9hicule ne peut d\u00E9cemment \u00EAtre avant sa date d\u2019arriv\u00E9e\u00A0\uD83D\uDE2C. Si tu y arrives c\u2019est que tu as une machine \u00E0 remonter le temps\u00A0\uD83D\uDD70\uFE0F.
error.message.VEHICLE_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=Au moins une date de pr\u00E9sence du v\u00E9hicule (\u201D{0}\u201C au \u201D{1}\u201C) est en dehors des dates du projet (\u201D{2}\u201C au \u201D{3}\u201C). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0?. Pour signifier qu\u2019un v\u00E9hicule est pr\u00E9sent tout au long du projet, le mieux C\u2019est de ne pas pr\u00E9ciser ses dates de pr\u00E9sence\u00A0?.
error.message.VEHICLE_DELETE_HAS_MOVEMENT=Tu es entrain de supprimer un v\u00E9hicule qui a d\u00E9j\u00E0 au moins un mouvement\u00A0\uD83D\uDE97. Si je te laisse faire, on va perdre des informations de l\u2019historique, ce qui n\u2019est pas possible tant qu\u2019il n\u2019y a pas prescription pour d\u2019\u00E9ventuelle infraction au code de la route\u00A0\uD83D\uDE94.
error.message.ACTIVITY_NAME_NULL_OR_BLANK=l\u2019activit\u00E9 doit obligatoirement avoir un nom. N\u2019est-ce pas plus pratique pour l\u2019identifier sans retenir un identifiant comme \u201Dfcac7e29-f64f-4b18-8ce0-dffe3281b4b6\u201C\u00A0?
error.message.ACTIVITY_NAME_TOO_LONG=Le nom de l\u2019activit\u00E9 est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.ACTIVITY_DESCRIPTION_TOO_LONG=La description de l\u2019activit\u00E9 est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.ACTIVITY_DURATION_FORMAT_FAILED=La dur\u00E9e de l\u2019activit\u00E9 sp\u00E9cifi\u00E9e n\u2019est pas au bon format\u00A0?. On accepte uniquement le format ISO 8601\u00A0?.
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_NULL=Il semble que dans la fourchette du nombre de participants sp\u00E9cifi\u00E9e pour l\u2019activit\u00E9, le maximum ou le minimum n\u2019est pas d\u00E9fini.\u00A0?
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_TOO_LOW=Sans jugement mais comment veux-tu faire une activit\u00E9 avec un minimum 0 participant\u00A0\uD83E\uDE84\u00A0? La logique voudrait au moins un participant pour faire une activit\u00E9.
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_MAX_IS_HIGHER_THAN_MIN=Dans la fourchette de participant \u00E0 l\u2019activit\u00E9, le maximum, ne peux \u00E9videmment pas \u00EAtre inf\u00E9rieur au minimum\u00A0?.
error.message.ACTIVITY_START_LATER_THAN_END=La date de fin de disponibilit\u00E9 d\u2019une activit\u00E9 ne peut d\u00E9cemment \u00EAtre avant sa date de d\u00E9but de disponibilit\u00E9\u00A0\uD83D\uDE2C. Si tu y arrives c\u2019est que tu as une machine \u00E0 remonter le temps\u00A0\uD83D\uDD70\uFE0F.
error.message.ACTIVITY_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=Au moins une date de disponibilit\u00E9 de l\u2019activit\u00E9 (\u201C{0}\u201D au \u201C{1}\u201D) est en dehors des dates du projet (\u201C{2}\u201D au \u201C{3}\u201D). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0\uD83E\uDD2F. Pour signifier qu\u2019une activit\u00E9 est disponible tout au long du projet, le mieux c\u2019est de ne pas pr\u00E9ciser ses dates de disponibilit\u00E9s\u00A0\uD83D\uDCA1.
error.message.ACTIVITY_DELETE_HAS_MOVEMENT=Tu es entrain de supprimer une activit\u00E9 qui a d\u00E9j\u00E0 au moins un mouvement\u00A0?. Si je te laisse faire, on va perdre des informations de l\u2019historique, ce qui n\u2019est pas possible tant que le projet n\u2019est pas fini.
error.message.COMMUNICATION_DATETIME_NULL=La communication doit obligatoirement avoir un horodatage. N\u2019est-ce pas plus pratique pour savoir quand elle a lieu\u00A0?\u00A0\uD83D\uDE05
error.message.COMMUNICATION_DATETIME_OUT_OF_PROJECT_DATE_RANGE=L\u2019horodatage de la communication \u201C{0}\u201D est en dehors des dates du projet (\u201C{1}\u201D au \u201C{2}\u201D). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0\uD83E\uDD2F. Tu peux cr\u00E9er une communication li\u00E9e \u00E0 un projet \u00E0 condition que la date de ta communication dans les dates de ton projet.
error.message.COMMUNICATION_MOVEMENT_IS_AFTER_COMMUNICATION=l\u2019horodatage de la communication est avant celui du mouvement auquel elle est li\u00E9e\u00A0?.
error.message.COMMUNICATION_MESSAGE_TOO_LONG=Le message de la communication est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.COMMUNICATION_MOVEMENT_OR_ALERT_NULL=La communication doit obligatoirement \u00EAtre li\u00E9e \u00E0 un mouvement. N\u2019est-ce pas plus pratique pour savoir avec qui l\u2019\u00E9change a lieu\u00A0?
error.message.COMMUNICATION_MOVEMENT_NOT_FOUND_IN_COMMUNICATION_PROJECT=Le mouvement est introuvable dans le projet\u00A0?. V\u00E9rifie bien le mouvement saisi puis essayes \u00E0 nouveau.
error.message.COMMUNICATION_MOVEMENT_NOT_VISIBLE=Le mouvement attach\u00E9 \u00E0 la communication est d\u00E9sactiv\u00E9. V\u00E9rifie \u00E7a\u00A0!
error.message.COMMUNICATION_MOVEMENT_CONTENT_TYPE_NOT_REGISTERED=Les communications ne sont possibles qu\u2019avec des mouvements de participants inscrits\u00A0?. Ainsi ils permettent de tracer les \u00E9changes avec les participants \u00E0 l\u2019ext\u00E9rieur de l\u2019enceinte du projet\u00A0?.
error.message.COMMUNICATION_MOVEMENT_TYPE_NOT_OUT=Les communications ne sont possibles qu\u2019avec des sorties\u00A0?. En effet, \u00E7a n\u2019a pas de sens de tracer les \u00E9changes avec les participants qui sont dans l\u2019enceinte du projet.
error.message.ALERT_TITLE_NULL_OR_BLANK=l\u2019alerte doit obligatoirement avoir un titre. N\u2019est-ce pas plus pratique pour l\u2019identifier sans retenir un identifiant comme \u201Dfcac7e29-f64f-4b18-8ce0-dffe3281b4b6\u201C\u00A0?
error.message.ALERT_TITLE_TOO_LONG=Le titre de l\u2019alerte est trop long\u00A0\uD83D\uDE07. Il faut bien une limite et elle est fix\u00E9e \u00E0 \u201C{0}\u201D pour ce champ.
error.message.ALERT_STATUS_NULL=L\u2019alerte doit obligatoirement avoir un status. N\u2019est-ce pas plus pratique pour savoir si elle est toujours d\u2019actualit\u00E9\u00A0?\u00A0\uD83D\uDE05
error.message.ALERT_DATETIME_OUT_OF_PROJECT_DATE_RANGE=L\u2019horodatage de l\u2019alerte \u201C{0}\u201D est en dehors des dates du projet (\u201C{1}\u201D au \u201C{2}\u201D). Personnellement, je ne trouve pas que \u00E7a fasse sens\u00A0\uD83E\uDD2F. Tu peux cr\u00E9er une alerte li\u00E9e \u00E0 un projet \u00E0 condition que la date de ton alerte soit incluse dans les dates de ton projet.
error.message.ALERT_COMMUNICATION_OUT_OF_ALERT_DATETIME=Le nouvel horodatage nouvelles dates de l\u2019alerte \u201C{0}\u201D est apr\u00E8s au moins une communication qui lui est li\u00E9e\u00A0\uD83E\uDD2F. Tu peux modifier l\u2019horodatage d\u2019une alerte mais dans la limite des communications qui lui sont associ\u00E9es. Sinon il faut les supprimer.
error.message.ALERT_DELETE_HAS_COMMUNICATION=u es entrain de supprimer une alerte qui a d\u00E9j\u00E0 au moins une communication\u00A0?. Si je te laisse faire, on va perdre des informations de l\u2019historique, ce qui n\u2019est pas possible tant que le projet n\u2019est pas fini.
error.message.ALERT_STATUS_IS_NOT_UPDATABLE=L\u2019alerte que tu tentes de modifier a un statut qui la rend non modifiable. V\u00E9rifies le statut de l\u2019alerte et essayes \u00E0 nouveau\u00A0\uD83E\uDD14.
error.message.MOVEMENT_DRIVERS_NOT_MAJOR=Au moins un conducteur du mouvement n\u2019est pas majeur. C\u2019est un probl\u00E8me majeur si un mineur conduit\u00A0\uD83D\uDE05.
error.message.COMMUNICATION_ALERT_IS_AFTER_COMMUNICATION=L\u2019horodatage de la communcation est avant celui de l\u2019alerte \u00E0 laquelle elle est li\u00E9e\u00A0\uD83E\uDD2F.
error.message.COMMUNICATION_ALERT_NOT_VISIBLE=L\u2019alerte attach\u00E9e \u00E0 la communication est d\u00E9sactiv\u00E9e. V\u00E9rifie \u00E7a\u00A0!
error.message.COMMUNICATION_ALERT_IS_NOT_COMPATIBLE_WITH_COMMUNICATION_CREATION=Le statut de l\u2019alerte est incompatible avec la cr\u00E9ation de communication\u00A0?. Tu peux ajouter une communication uniquement sur les alertes en cours.
error.message.MOVEMENT_CANNOT_BE_UPDATED=Un d\u00E9part d\u00E9finitif ou une sortie d\u2019invit\u00E9 n\u2019est pas modifiable\u00A0?.
error.message.MOVEMENT_CANNOT_BE_DISABLED=Un d\u00E9part d\u00E9finitif ou une sortie d\u2019invit\u00E9 n\u2019est pas masquable\u00A0?.
error.message.MOVEMENT_CANNOT_BE_ENABLED=Un d\u00E9part d\u00E9finitif ou une sortie d\u2019invit\u00E9 n\u2019est pas d\u00E9masquable\u00A0?.
error.message.MOVEMENT_CANNOT_BE_DELETED=Un d\u00E9part d\u00E9finitif ou une sortie d\u2019invit\u00E9 n\u2019est pas supprimable\u00A0?.
error.message.PURGE_DATE_THRESHOLD_IN_FUTURE=Un seuil de purge dans le futur, tout est \u201Cassez vieux\u201D\u00A0: c\u2019est le grand m\u00E9nage int\u00E9gral\u00A0\uD83E\uDDF9. Choisis plut\u00F4t une date d\u00E9j\u00E0 pass\u00E9e.
error.message.REFRESH_COOKIE_MISSING=Ta session n\u2019a plus de cookie de renouvellement \u2014 il a expir\u00E9, ou tu t\u2019es d\u00E9connect\u00E9 dans un autre onglet \uD83C\uDF6A. Reconnecte-toi et c\u2019est reparti.
error.message.REDIRECT_URI_NOT_ALLOWED=Cette adresse de retour n\u2019est pas des n\u00F4tres \uD83D\uDEAB. On ne te renvoie que vers Registry, jamais ailleurs.
error.message.STATE_BLANK=Il manque \u00E0 cette connexion le jeton qui la relie \u00E0 ton navigateur \uD83E\uDDF5. Reprends depuis la page de connexion.
error.message.STATE_MISMATCH=Cette connexion ne correspond pas \u00E0 celle ouverte dans ce navigateur \uD83D\uDD75\uFE0F. Elle a peut-\u00EAtre expir\u00E9, ou ce n\u2019est pas toi qui l\u2019as lanc\u00E9e. Reprends depuis la page de connexion.
