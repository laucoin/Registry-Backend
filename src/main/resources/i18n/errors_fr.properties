error.title.501                                                     = 🧪 Fonctionnalité non implémentée

error.message.400                                                   = On dirait que votre requête est invalide (ça peut-être due à des données invalides ou manquantes). Vérifies les informations et réessayes 🤔.
error.message.401                                                   = Connectes-toi ! Si c’est déjà le cas essayes de reconnecter 🔐.
error.message.403                                                   = Tu n’as pas la permission d’accéder à cette ressource 🚫. Contactes l’administrateur de ton projet si besoin.
error.message.404                                                   = Hmm… On ne trouve pas ce que tu cherches 🔍. Tu es sûr(e) de son existance ?
error.message.405                                                   = La méthode utilisée n’est pas supportée. Essayes une autre méthode 🛑.
error.message.408                                                   = Cela prend plus de temps que prévu ⏳. Essayes de rafraîchir ou reviens plus tard.
error.message.409                                                   = Il y a un conflit. Vérifies les données envoyées et réessayes ⚠️.
error.message.413                                                   = Oula ! Votre demande est trop volumineuse 🐳. Essayes de réduire la taille.
error.message.414                                                   = L'URL est trop longue. Raccourcis-la et réessayes 🔗.
error.message.415                                                   = Le format de fichier envoyé n’est pas pris en charge 📂. Utilises un format supporté !
error.message.420                                                   = Ta connexion est faible 🐢, rapproches de la box. Si tu es en 4G, rapproches toi d’une fenêtre. Si tu es en 3G, rapproches toi d’un autre siècle.
error.message.422                                                   = Les données envoyées sont incomplètes ou incorrectes 📋. Vérifies-les et réessayes !
error.message.424                                                   = Une dépendance externe nécessaire a planté. Réessayes plus tard 🔄.
error.message.429                                                   = Tu as envoyé trop de requêtes en peu de temps. Essayes de nouveau plus tard ⏱️.
error.message.500                                                   = Une erreur inattendue est survenue, nous travaillons à la résoudre 🛠️. Si l’erreur persiste n’hésites pas à nous remonter cette erreur.
error.message.501                                                   = Cette fonctionnalité n’est pas encore disponible. Patientes un peu ⏳ c’est prévu pour bientôt !

error.message.NOT_IMPLEMENTED_YET                                   = Cette fonctionnalité n’est pas encore disponible. Patientes un peu ⏳ c’est prévu pour bientôt !
error.message.NO_PARAMETER_FOUND_FOR_SPECIFIED_NAME                 = Impossible de vérifier une donnée… elle est introuvable 🕵️‍♂️.
error.message.COMPARING_WRONG_PARAMETER_TYPE                        = Impossible de comparer des carottes 🥕 et des entrecôtes 🥩. Les paramètres (“{0}” et “{1}”) ne sont pas comparables.
error.message.NOT_FOUND_WITH_GIVEN_IDENTIFIER                       = Hmm… On ne trouve rien avec l’identifiant “{0}” 🔍. Tu es sûr(e) de son existance ?
error.message.INVALID_TOKEN                                         = Ton jeton d’authentification est invalide ou périmé. Tu devrais le rafraîchir ! 🔄
error.message.NOT_AUTHENTICATED                                     = Connectes-toi ! Si c’est déjà le cas essayes de reconnecter 🔐.
error.message.FAILED_TO_LOGIN_FOR_UNKNOWN_REASON                    = Fichtre ! Une erreur inconnue est survenue durant la connexion 😱. Réessayes plus tard ou contactes l’administrateur.
error.message.NOT_ENOUGH_PERMISSION                                 = Tu n’as pas les droits ! Tu peux demander de l’aide à Chuck Norris pour forcer le passage mais je doute que ça suffise. 😏
error.message.PARAMETER_TYPE_MISMATCH                               = Tu m’as envoyé une entrecôte 🥩 alors que j’attendais des carottes 🥕. Le type de donnée est incorrecte.
error.message.DATE_IS_NULL                                          = Si tu m’envoies un horodatage 📆, il faut au moins que la date soit définie.
error.message.TIME_IS_SET_BUT_NOT_DATE                              = Si tu m’envoies un horodatage 📆. L’heure ne peut pas être définit sans date. C’est comme si je te donne rendez vous à 15h30 sans préciser le jour, tu vois le soucis ?
error.message.PAGE_SIZE_IS_LOWER_THAN_ONE                           = Tu viens d’inventer la pagination quantique 👏. Cette page existe et n’existe pas en même temps. Tu te rends bien compte qu’une page avec une taille inférieure à 1 c’est compliqué à calculer ?
error.message.PAGE_SIZE_IS_UPPER_THAN_MAX_PAGE_SIZE                 = On t’envois des pages, pas des encyclopédies 🤣! La taille maximum d’une page c’est “{0}”.
error.message.PAGE_NUMBER_IS_LOWER_THAN_ZERO                        = Erreur 404 ? Non, erreur -404 ! Un numéro de page négatif ?
error.message.UNKNOWN_ERROR                                         = Une erreur inattendue est survenue, nous travaillons à la résoudre 🛠️. Si l’erreur persiste n’hésites pas à nous remonter cette erreur.

error.message.AUTH_EMAIL_OR_ID_NOT_FOUND_IN_TOKEN                   = Impossible de récupérer les informations nécessaires à la connexion auprès du tiers 🕵️‍♂️.
error.message.AUTH_BLOCKED_ACCOUNT                                  = Ton compte a été bloqué. Rapproches-toi d’un administrateur pour avoir des informations supplémentaires 💬.
error.message.AUTH_IMPERSONATED_ACCOUNT                             = Ton compte a été anonymisé 🧽. Il est donc impossible de te connecter.
error.message.REDIRECT_URI_BLANK                                    = L’URL de redirection ne peut pas être vide. Et oui, c’est indispensable ! 🌐
error.message.AUTHORIZATION_CODE_BLANK                              = Le code permettant d’obtenir un jeton d’authentification est vide 🤔. Sans code pas de jeton ! Si le problème persiste reconnectes toi.
error.message.AUTHORIZATION_CODE_OUTDATED                           = Le code permettant d’obtenir un jeton d’authentification est périmé 🤔. Sans code valide pas de jeton ! Si le problème persiste reconnectes toi.
error.message.REFRESH_TOKEN_BLANK                                   = Le code permettant de renouveller le jeton d’authentification est vide 🤔. Sans code pas de jeton ! Si le problème persiste reconnectes toi.
error.message.REFRESH_TOKEN_OUTDATED                                = Le code permettant de renouveller le jeton d’authentification est périmé 🤔. Sans code valide pas de jeton ! Si le problème persiste reconnectes toi.
error.message.AUTH_PROVIDER_FAILED                                  = Le tiers permettant de te connecté à rencontré une erreur inattendue. Malheureusement, sans lui tu n’es pas connecté et sans connection pas d’accès ⛔️.

error.message.USER_ASSIGNS_ROLE_HIGHER_THAN_ITS_OWN                 = Le rôle “{0}” est supérieur au tiens 🫡. Tu ne peux donc pas l’assigner.
error.message.USER_UPDATE_LAST_APPLICATION_ADMINISTRATOR_ROLE       = Tu es entrain de modifier le rôle du dernier administrateur de l’application 🤯. Si je te laisse faire, je fais devoir réparer l’application (et j’ai la flemme) donc non.
error.message.USER_BLOCK_LAST_APPLICATION_ADMINISTRATOR             = Tu es entrain de bloquer le dernier administrateur de l’application 🤯. Si je te laisse faire, je fais devoir réparer l’application (et j’ai la flemme) donc non.
error.message.USER_IMPERSONATE_LAST_APPLICATION_ADMINISTRATOR       = Tu es entrain d’anonymiser le dernier administrateur de l’application 🤯. Si je te laisse faire, je fais devoir réparer l’application (et j’ai la flemme) donc non. Si tu veux vraiment faire ça, tu peux nommer un autre administrateur et ainsi tu pourras réessayer d’anonymiser celui-ci.
error.message.USER_DELETE_LAST_APPLICATION_ADMINISTRATOR            = Tu es entrain de supprimer le dernier administrateur de l’application 🤯. Si je te laisse faire, je fais devoir réparer l’application (et j’ai la flemme) donc non. Si tu veux vraiment faire ça, tu peux nommer un autre administrateur et ainsi tu pourras réessayer d’anonymiser celui-ci.
error.message.USER_BLOCK_LAST_PROJECT_ADMINISTRATOR                 = Tu es entrain de bloquer le dernier administrateur du projet “{0}” 🤯. Si je te laisse faire, je fais devoir réparer le projet (et j’ai la flemme) donc non.
error.message.USER_BLOCK_CURRENT_USER                               = Je me permettrai pas de te juger mais bloquer ton compte ce n’est pas l’idée du siècle 🤦‍♀️.
error.message.USER_IMPERSONATE_CURRENT_USER                         = Impossible d’anonymiser ton compte de cette façon. Passes par les paramètres. 🕵️‍♂️
error.message.USER_DELETE_CURRENT_USER                              = Tu ne peux pas supprimer ton compte, par contre tu peux l’anonymiser pour effacer toute les données qui te sont liées.
error.message.USER_IMPERSONATE_LAST_PROJECT_ADMINISTRATOR           = Tu es entrain d’anonymiser le dernier administrateur du projet “{0}” 🤯. Si je te laisse faire, je fais devoir réparer le projet (et j’ai la flemme) donc non. Si tu veux vraiment faire ça, tu peux nommer un autre administrateur OU supprimer le projet et ainsi tu pourras réessayer d’anonymiser celui-ci.
error.message.USER_DELETE_LAST_PROJECT_ADMINISTRATOR                = Tu es entrain de supprimer le dernier administrateur du projet “{0}” 🤯. Si je te laisse faire, je fais devoir réparer le projet (et j’ai la flemme) donc non. Si tu veux vraiment faire ça, tu peux nommer un autre administrateur OU supprimer le projet et ainsi tu pourras réessayer de supprimer celui-ci.

error.message.PROJECT_NAME_NULL_OR_BLANK                            = Le projet doit obligatoirement avoir un nom. C’est pas plus pratique pour savoir duquel on parle ? 😅
error.message.PROJECT_NAME_TOO_LONG                                 = Le nom de ton projet est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.PROJECT_BEGIN_LATER_THAN_END_TIME                     = Ton projet ne peut décemment pas finir avant d’avoir débuté 😬. Si tu y arrives c’est que tu as une machine à remonter le temps ⏱️.
error.message.PROJECT_OPTIONS_MISSING                               = Il manque une option sur ton projet. Pour activer “{0}”, il te faut absolument “{1}”. Sinon l’application ne va pas aimer 🤯.
error.message.PROJECT_DATE_CONFLICT_WITH_ELEMENTS                   = Les nouvelles dates du projet “{0}” sont en conflit au moins avec un élément existant 🤯. Tu peux modifier les dates de ton projet mais dans la limite des éléments déjà créé. Sinon il faut les supprimer.

error.message.PROJECT_PROFILE_ROLE_BLANK                            = Un profil d’accès à un projet doit obligatoirement avoir un rôle spécifié. Pas de rôle, pas de profil.
error.message.PROJECT_PROFILE_START_ACCESS_LATER_THAN_END_ACCESS    = L’accès au profile ne peut décemment pas finir avant d’avoir débuté 😬. Si tu y arrives c’est que tu as une machine à remonter le temps ⏱️.
error.message.PROJECT_PROFILE_USERS_EMPTY                           = Tu veux créer un ou plusieurs profils d’accès à un projet. Mais pour cela tu dois obligatoirement préciser pour quels utilisateurs 🧑‍💻 tu veux les créer.
error.message.PROJECT_PROFILE_STATUS_NOT_ACCEPTED_OR_REJECTED       = Pour accepter ou refuser un profil, il faut que tu envois le bon statut adéquat 😅.
error.message.PROJECT_PROFILE_BLOCK_LAST_PROJECT_ADMINISTRATOR      = Tu es entrain de bloquer le dernier administrateur du projet “{0}” 🤯. Si je te laisse faire, je fais devoir réparer le projet (et j’ai la flemme) donc non.
error.message.PROJECT_PROFILE_DELETE_LAST_PROJECT_ADMINISTRATOR     = Tu es entrain de supprimer le dernier administrateur du projet “{0}” 🤯. Si je te laisse faire, je fais devoir réparer le projet (et j’ai la flemme) donc non. Si tu veux vraiment faire ça, tu peux nommer un autre administrateur OU supprimer le projet et ainsi tu pourras réessayer de supprimer celui-ci.
error.message.PROJECT_PROFILE_UPDATE_LAST_PROJECT_ADMINISTRATOR     = Tu es entrain de changer le rôle du dernier administrateur du projet “{0}” 🤯. Si je te laisse faire, je fais devoir réparer le projet (et j’ai la flemme) donc non.
error.message.PROJECT_PROFILE_UPDATE_ROLE_HIGHER_THAN_CURRENT_USER  = Tu ne peux pas mettre à jour un profil ayant un rôle plus élevé que le tiens 👮.
error.message.PROJECT_PROFILE_ASSIGNS_ROLE_HIGHER_THAN_CURRENT_USER = Le rôle “{0}” est supérieur à celui de ton profil 🫡. Tu ne peux donc pas l’assigner.
error.message.PROJECT_PROFILE_ALREADY_EXIST_ON_RANGE                = Un profil existe déjà pour au moins un utilisateur sur la période spécifiée. Pour éviter de perdre en clarté, il n’est pas possible qu’une personne ait plus d’un profile sur la même période 👀.

error.message.PARTICIPANT_FIRST_NAME_NULL_OR_BLANK                  = Le participant doit obligatoirement avoir un prénom. C’est pas plus pratique pour l’appeler ? 😅
error.message.PARTICIPANT_FIRST_NAME_TOO_LONG                       = Le prénom du participant est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.PARTICIPANT_LAST_NAME_NULL_OR_BLANK                   = Le participant doit obligatoirement avoir un nom de famille. Tout le monde en a un non ? 😅
error.message.PARTICIPANT_LAST_NAME_TOO_LONG                        = Le nom de famille du participant est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.PARTICIPANT_BIRTHDAY_NULL                             = Le participant doit obligatoirement avoir une date de naissance. Tout le monde en a une non ? 😅
error.message.PARTICIPANT_BIRTHDAY_FUTURE                           = C’est peut-être pas très inclusif mais on n’accepte que les participants qui sont déjà née 🤰. Ne fait pas de scandale, les femmes enceintes sont les bienvenues, c’est juste que les dates de naissance dans le futur moins.
error.message.PARTICIPANT_START_LATER_THAN_END                      = La date départ d’un participant ne peut décemment être avant sa date d’arrivée 😬. Si tu y arrives c’est que tu as une machine à remonter le temps ⏱️.
error.message.PARTICIPANT_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE  = Au moins une date de présence du participant (“{0}” au “{1}”) est en dehors des dates du projet (“{2}” au “{3}”). Personnellement, je trouve que ça ne fait pas sens 🤯. Pour signifier qu’un participant est présent tout au long du projet, le mieux c’est de ne pas préciser ses dates de présences 💡.
error.message.PARTICIPANT_IN_PROJECT_ALREADY_LINKED_TO_USER         = L’utilisateur est déjà lié au participant “{0}” dans ce projet. Pas de doublons ! 🚫
error.message.PARTICIPANT_OUT_OF_MOVEMENT_DATETIME                  = Les nouvelles dates du participant sont en conflit avec “{0}” mouvement qui lui sont lié 🤯. Tu peux modifier les dates d’un participant mais dans la limite des mouvements déjà créés. Sinon il faut les supprimer.
error.message.PARTICIPANT_GROUPS_NOT_FOUND_IN_PARTICIPANT_PROJECT   = Au moins un groupe du participant est introuvable dans le projet 🙈. Vérifies bien les groupes saisis puis essayes à nouveau.
error.message.PARTICIPANT_GROUPS_NOT_VISIBLE                        = Au moins un groupe du participant est masqué. Un groupe masqué 😷 ne peut pas être ajouté à un participant.
error.message.PARTICIPANT_DISABLE_LAST_GROUP_MEMBER                 = Tu es entrain de masquer le dernier participant d’un groupe 🤯. Si je te laisse faire, je fais devoir réparer le groupe (et j’ai la flemme) donc non.
error.message.PARTICIPANT_DELETE_HAS_MOVEMENT                       = Tu es entrain de supprimer un participant qui a déjà au moins un mouvement 🏃. Si je te laisse faire, on va perdre des informations de l’historique, ce qui n’est pas possible tant que le projet n’est pas finit.
error.message.PARTICIPANT_DELETE_LAST_GROUP_MEMBER                  = Tu es entrain de supprimer le dernier membre d’un groupe 🤯. Si je te laisse faire, je fais devoir réparer le groupe (et j’ai la flemme) donc non. Si tu veux vraiment faire ça, tu peux supprimer le groupe et réessayer 💡.

error.message.MOVEMENT_DATETIME_NULL                                = Le mouvement doit obligatoirement avoir un horodatage. C’est pas plus pratique pour savoir quand il a lieu ? 😅
error.message.MOVEMENT_DATETIME_OUT_OF_PROJECT_DATE_RANGE           = L’horodatage du mouvement “{0}” est en dehors des dates du projet (“{1}” au “{2}”). Personnellement, je trouve que ça ne fait pas sens 🤯. Tu peux créer un mouvement liée à un projet à condition que la date de ton mouvement soit incluse dans les dates de ton projet.
error.message.MOVEMENT_TYPE_NULL                                    = Le mouvement doit obligatoirement avoir un type. C’est pas plus pratique pour savoir s’il s’agit d’une entrée ou d’une sortie ? 😅
error.message.MOVEMENT_CONTENT_EMPTY                                = Le mouvement doit obligatoirement avoir des participants. Sans participant pas de mouvement, si ? 😅
error.message.MOVEMENT_CONTENT_PARTICIPANT_ID_NULL                  = Il semble que dans le contenu spécifié pour le mouvement, il manque l’identifiant d’un participant. 👀
error.message.MOVEMENT_ODD_GUEST_CONTENT                            = Il n’est pas possible de créer des invités pour créer une sortie. En effet, un invité qui sort a forcément du rentrée 🙈 ? Donc si il est bien rentré, il faut le faire sortir en donnant son identifiant afin d’éviter les doublons.
error.message.MOVEMENT_REMOVE_GUEST_CONTENT                         = Tu as retiré au moins un invité en modifiant le mouvement. Ce n’est pas possible ⛔️ ! On part du principe que tu as eu les informations pour le faire rentrer c’est qu’il était là. Donc tu peux le faire sortir 😉.
error.message.MOVEMENT_PARTICIPANTS_NOT_FOUND_IN_MOVEMENT_PROJECT   = Au moins un participant du mouvement est introuvable dans le projet. Vérifies bien les participants saisis et leurs dates de présences 📆 puis essayes à nouveau.
error.message.MOVEMENT_PARTICIPANTS_NOT_VISIBLE                     = Le mouvement lié à la communication est masqué. Un mouvement masqué 😷 ne peut pas liée à une communication.
error.message.MOVEMENT_VEHICLES_NOT_FOUND_IN_MOVEMENT_PROJECT       = Au moins un véhicule du mouvement est introuvable dans le projet. Vérifies bien les véhicules saisis et leurs dates de présences 📆 puis essayes à nouveau.
error.message.MOVEMENT_VEHICLES_NOT_VISIBLE                         = Au moins un véhicule du mouvement est masqué. Un véhicule masqué 😷 ne peut pas être inclus dans un mouvement.
error.message.MOVEMENT_TYPE_AND_REASON_ARE_INCOMPATIBLE             = Le type et le motif du mouvement sont incompatibles. Pas de motif pour la sortie d’invités ni pour l’entrée de participants inscrits. Dans les autres cas un motif est requis et ces derniers ne sont pas commun entre les participants inscrits et les invités 🤯.
error.message.MOVEMENT_ACTIVITY_AND_REASON_ARE_DEFINED              = Une activité est par essence un motif de sortie donc tu ne peux pas spécifier une activité ET un motif de sortie 😬.
error.message.MOVEMENT_ACTIVITY_NOT_FOUND_IN_MOVEMENT_PROJECT       = L’activité du mouvement est introuvable dans le projet. Vérifies bien l’activité saisie et ses dates de présences 📆 puis essayes à nouveau.
error.message.MOVEMENT_ACTIVITY_NOT_VISIBLE                         = L’activité du mouvement est masqué. Une activité masqués 😷 ne peut pas être incluse dans un mouvement.
error.message.MOVEMENT_COMMUNICATION_OUT_OF_MOVEMENT_DATETIME       = Le nouvel horodatage du mouvement est après “{0}” communications qui lui sont lié 🤯. Tu peux modifier l’horodatadage d’un mouvement mais dans la limite des communications déjà créés. Sinon il faut les supprimer.
error.message.MOVEMENT_UPDATE_CHANGE_TYPE                           = Il n’est pas possible de changer le type d’un mouvement. C’est à dire qu’une entrée ne peux pas devenir une sortie. Si tu t’es trompé, je t’invite à masquer/supprimer le mouvement et à recréer le mouvement dans le bon sens.a
error.message.MOVEMENT_UPDATE_CHANGE_CONTENT_TYPE                   = Il n’est pas possible de changer le type de participant. C’est à dire que tu ne peux pas changer de participant inscrit à invité.

error.message.GROUP_NAME_NULL_OR_BLANK                              = Le groupe doit obligatoirement avoir un nom. C’est pas plus pratique pour l’identifier sans un retenir un identifiant comme “e7da4aed-3dac-4b32-92a3-786cb7a373b8” ? 😅
error.message.GROUP_NAME_TOO_LONG                                   = Le nom du groupe est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.GROUP_START_LATER_THAN_END                            = La date départ d’un groupe ne peut décemment être avant sa date d’arrivée 😬. Si tu y arrives c’est que tu as une machine à remonter le temps ⏱️.
error.message.GROUP_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE        = Au moins une date de présence du groupe (“{0}” au “{1}”) est en dehors des dates du projet (“{2}” au “{3}”). Personnellement, je trouve que ça ne fait pas sens 🤯. Pour signifier qu’un groupe est présent tout au long du projet, le mieux c’est de ne pas préciser ses dates de présences 💡.
error.message.GROUP_MEMBERS_EMPTY                                   = Il est impossible de créer un groupe sans membre 🦵. Et de toute façon ça ne fait aucun sens, si ?
error.message.GROUP_MEMBERS_NOT_FOUND_IN_GROUP_PROJECT              = Au moins un membre du groupe est introuvable dans le projet 🙈. Vérifies bien les participants saisis puis essayes à nouveau.
error.message.GROUP_MEMBERS_ALREADY_ADDED                           = Au moins un membre du groupe été déjà dans ce dernier 🤯. Vérifies bien les participants saisis puis essayes à nouveau.
error.message.GROUP_MEMBERS_NOT_VISIBLE                             = Au moins un membre du groupe est masqué. Un participant masqué 😷 ne peut pas être ajouté dans un groupe.
error.message.GROUP_LAST_MEMBERS_CANNOT_BE_REMOVED                  = Il est impossible de retirer le dernier membre du groupe. Si tu veux vraiment faire ça, tu peux supprimer le groupe directement 💡.

error.message.VEHICLE_LICENSE_PLATE_NULL_OR_BLANK                   = Le véhicule doit obligatoirement avoir une plaque d’immatriculation. C’est obligatoire pour prendre la route de toute façon ? 😅
error.message.VEHICLE_LICENSE_PLATE_TOO_LONG                        = La plaque d’immatriculation du véhicule est trop longue 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.VEHICLE_BRAND_NULL_OR_BLANK                           = Le véhicule doit obligatoirement avoir une marque. Même si elle est controversé, elle existe quand même ? 😅
error.message.VEHICLE_BRAND_TOO_LONG                                = Le nom de la marque du véhicule est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.VEHICLE_MODEL_NULL_OR_BLANK                           = Le véhicule doit obligatoirement avoir un modèle. Même si c’est un multiplat, on l’accepte. 😅
error.message.VEHICLE_MODEL_TOO_LONG                                = Le nom du modèle du véhicule est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.VEHICLE_START_LATER_THAN_END                          = La date départ d’un véhicule ne peut décemment être avant sa date d’arrivée 😬. Si tu y arrives c’est que tu as une machine à remonter le temps ⏱️.
error.message.VEHICLE_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE      = Au moins une date de présence du véhicule (“{0}” au “{1}”) est en dehors des dates du projet (“{2}” au “{3}”). Personnellement, je trouve que ça ne fait pas sens 🤯. Pour signifier qu’un véhicule est présent tout au long du projet, le mieux c’est de ne pas préciser ses dates de présences 💡.
error.message.VEHICLE_DELETE_HAS_MOVEMENT                           = Tu es entrain de supprimer un véhicule qui a déjà au moins un mouvement 🚗. Si je te laisse faire, on va perdre des informations de l’historique, ce qui n’est pas possible tant qu’il n’y a pas prescription pour d’éventuelle infraction au code de la route 🚔.

error.message.ACTIVITY_NAME_NULL_OR_BLANK                           = L’activité doit obligatoirement avoir un nom. C’est pas plus pratique pour l’identifier sans un retenir un identifiant comme “e7da4aed-3dac-4b32-92a3-786cb7a373b8” ? 😅
error.message.ACTIVITY_NAME_TOO_LONG                                = Le nom de l’activité est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.ACTIVITY_DESCRIPTION_TOO_LONG                         = La description de l’activité est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.ACTIVITY_DURATION_FORMAT_FAILED                       = La durée de l’activité spécifié n’est pas au bon format 😇. On accepte uniquement le format ISO 8601 💡.
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_NULL                    = Il semble que dans la fourchette du nombre de participant spécifiée pour l’activité, le maximum ou le minimum n’est pas définit. 👀
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_TOO_LOW                 = Sans jugement mais comment veux-tu faire une activité avec un minimum 0 participant 🪄 ? La logique voudrait au moins un participant pour faire une activité.
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_MAX_IS_HIGHER_THAN_MIN  = Dans la fourchette de participant à l’activité, le maximum, ne peux évidement pas être inférieur au minimum 🤯.
error.message.ACTIVITY_START_LATER_THAN_END                         = La date de fin de disponibilité d’une activité ne peut décemment être avant sa date de début de disponibilité 😬. Si tu y arrives c’est que tu as une machine à remonter le temps ⏱️.
error.message.ACTIVITY_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE     = Au moins une date de disponibilité de l’activité (“{0}” au “{1}”) est en dehors des dates du projet (“{2}” au “{3}”). Personnellement, je trouve que ça ne fait pas sens 🤯. Pour signifier qu’une activité est disponible tout au long du projet, le mieux c’est de ne pas préciser ses dates de disponibilités 💡.
error.message.ACTIVITY_DELETE_HAS_MOVEMENT                          = Tu es entrain de supprimer une activité qui a déjà au moins un mouvement 🏃. Si je te laisse faire, on va perdre des informations de l’historique, ce qui n’est pas possible tant que le projet n’est pas finit.

error.message.COMMUNICATION_DATETIME_NULL                           = La communication doit obligatoirement avoir un horodatage. C’est pas plus pratique pour savoir quand elle a lieu ? 😅
error.message.COMMUNICATION_DATETIME_OUT_OF_PROJECT_DATE_RANGE      = L’horodatage de la communication “{0}” est en dehors des dates du projet (“{1}” au “{2}”). Personnellement, je trouve que ça ne fait pas sens 🤯. Tu peux créer une communication liée à un projet à condition que la date de ta communication dans les dates de ton projet.
error.message.COMMUNICATION_MOVEMENT_IS_AFTER_COMMUNICATION         = L’horodatage de la communcation est avant celui du mouvement auquel elle est liée 🤯.
error.message.COMMUNICATION_MESSAGE_TOO_LONG                        = Le message de la communication est trop long 😇. Il faut bien une limite et elle est fixée à “{0}” pour ce champ.
error.message.COMMUNICATION_MOVEMENT_NULL                           = La communication doit obligatoirement être liée à une mouvement. C’est pas plus pratique pour savoir avec qui l’échange a lieu ? 😅
error.message.COMMUNICATION_MOVEMENT_NOT_FOUND_IN_MOVEMENT_PROJECT  = Le mouvement est introuvable dans le projet 🙈. Vérifies bien le mouvement saisi puis essayes à nouveau.
error.message.COMMUNICATION_MOVEMENT_NOT_VISIBLE                    = Le mouvement attaché à la communication est désactivé. Vérifie ça !
error.message.COMMUNICATION_MOVEMENT_CONTENT_TYPE_NOT_REGISTERED    = Les communications ne sont possible qu'avec des mouvements de participants inscrits ✍️. Ainsi ils permettent de tracer les échanges avec les participants à l'extérieur de l'enceinte du projet 😉.
error.message.COMMUNICATION_MOVEMENT_TYPE_NOT_OUT                   = Les communications ne sont possible qu'avec des sorties 🚪. En effet, ça n'a pas de sens de tracer les échanges avec les participants qui sont dans l'enceinte du projet.
