error.message.400                                                = Oops! Looks like your request isn't correct. Check it and try again.
error.message.401                                                = You're not logged in! Log in to continue.
error.message.403                                                = Sorry, you don't have permission to access this. Contact an admin if needed.
error.message.404                                                = Hmm... We can't find what you're looking for. Are you sure about the address?
error.message.405                                                = Oops! This action isn't allowed. Try another method.
error.message.408                                                = This is taking longer than expected. Try refreshing or come back later.
error.message.409                                                = There's a conflict with the data. Make sure everything is up to date.
error.message.413                                                = Whoa! Your request is too large. Try reducing its size.
error.message.414                                                = This URL is way too long! Try using a shorter one.
error.message.415                                                = Oops! This file type isn't supported. Try a different format.
error.message.420                                                = Your connection seems weak. Check your network and try again.
error.message.422                                                = Unable to process these data. Double-check and try again.
error.message.424                                                = An issue occurred with an external system. Try again later.
error.message.429                                                = Slow down! You're making too many requests. Wait a bit and try again.
error.message.500                                                = Something broke on our side. We're on it! Check back in a moment.
error.message.501                                                = This feature isn't available yet, but it's coming soon!

error.message.NOT_IMPLEMENTED_YET                                = This feature isn't ready yet... Patience, it's on its way! 🚧
error.message.NO_PARAMETER_FOUND_FOR_SPECIFIED_NAME              = Unable to validate a parameter… Seems like it’s hiding because we can’t find it. 😅
error.message.COMPARING_WRONG_PARAMETER_TYPE                     = Comparing "{0}" and "{1}"? Impossible, they’re not even the same type!
error.message.NOT_FOUND_WITH_GIVEN_IDENTIFIER                    = Nothing found with the identifier "{0}". Are you sure it exists? 🤔
error.message.INVALID_TOKEN                                      = Your token is invalid or expired. You should refresh it! 🔄
error.message.NOT_AUTHENTICATED                                  = Ah, you're not logged in. Log in to continue!
error.message.FAILED_TO_LOGIN_FOR_UNKNOWN_REASON                 = Gosh! Well, I didn't quite get it, but it's busted. Try again later or contact the administrator.
error.message.PARAMETER_TYPE_MISMATCH                            = A parameter is incorrect 🤷
error.message.NOT_ACCEPTED_LANGUAGE_HEADER                       = The language specified in "Accept-Language" isn’t accepted. Available languages: {0}. Over to you! 🌍
error.message.UNKNOWN_ERROR                                      = An unknown error occurred: "{0}". Sorry, I can’t provide more details! 🤷

error.message.AUTH_EMAIL_OR_ID_NOT_FOUND_IN_TOKEN                = The email or user ID is missing in the token. Ask your admin for help! 🕵️‍♂️
error.message.AUTH_BLOCKED_ACCOUNT                               = It seems you've done something wrong—your account is blocked. Not great, right? 😕
error.message.AUTH_IMPERSONATED_ACCOUNT                          = Your account has been anonymized. Logging in is not possible anymore...
error.message.REDIRECT_URI_BLANK                                 = The redirect URL can't be blank. Yes, it's essential! 🌐
error.message.AUTHORIZATION_CODE_BLANK                           = The authorization code is blank. Try a better approach. 🤔
error.message.AUTHORIZATION_CODE_OUTDATED                        = Your authorization code is outdated. Back to square one! 🔄
error.message.REFRESH_TOKEN_BLANK                                = The refresh token is blank. You can't proceed. 🚫
error.message.REFRESH_TOKEN_OUTDATED                             = Your refresh token is outdated. Back to square one! 🔄
error.message.AUTH_PROVIDER_FAILED                               = The authentication provider encountered an unexpected issue. Bummer, isn't it? 🤷

error.message.USER_ASSIGNS_ROLE_HIGHER_THAN_ITS_OWN              = Seriously? You can''t assign a role "{0}" higher than your own.
error.message.USER_UPDATE_LAST_APPLICATION_ADMINISTRATOR_ROLE    = Modifying the last admin? Risky business! An app without an admin is a bad idea. 🤯
error.message.USER_BLOCK_LAST_APPLICATION_ADMINISTRATOR          = Blocking the last admin? Not a smart move, trust me. 🔒
error.message.USER_IMPERSONATE_LAST_APPLICATION_ADMINISTRATOR    = You can't anonymize the last admin. An app without an admin is a bad idea. 🤯
error.message.USER_DELETE_LAST_APPLICATION_ADMINISTRATOR         = Deleting the last admin? Are you trying to break everything? ⛓️‍💥
error.message.USER_BLOCK_CURRENT_USER                            = No judgment, but blocking your own account isn't the idea of the century. 🔒
error.message.USER_IMPERSONATE_CURRENT_USER                      = You can't anonymize your account this way. Go to preferences. 🕵️‍♂️
error.message.USER_DELETE_CURRENT_USER                           = No judgment, but deleting your own account is not the idea of the century 🤯. If you want to leave the application go through the preferences and anonymize your account. It will be automatically deleted later.
error.message.USER_BLOCK_LAST_EVENT_ADMINISTRATOR                = Blocking the last admin for "{0}" won''t help its administration. 🔒
error.message.USER_IMPERSONATE_LAST_EVENT_ADMINISTRATOR          = You can''t anonymize the last admin for "{0}". Events need a responsible admin! 🤯
error.message.USER_DELETE_LAST_EVENT_ADMINISTRATOR               = Deleting the last admin for "{0}"? Are you sure you want to wreck the event? ⛓️‍💥

error.message.EVENT_NAME_NULL_OR_BLANK                           = No way! An empty name won't work.
error.message.EVENT_NAME_TOO_LONG                                = Did you see how long the name is? 🤯 Keep it under {0}.
error.message.EVENT_BEGIN_LATER_THAN_END_TIME                    = The end date can't be earlier than the start date. Do you have a time machine? 🕰️
error.message.EVENT_OPTIONS_MISSING                              = Option "{0}" without "{1}" doesn''t make sense.
error.message.EVENT_DATE_CONFLICT_WITH_ELEMENTS                  = You can modify the event dates, but it clashes with an existing element in the event "{0}". 🤔

error.message.EVENT_PROFILE_ROLE_BLANK                           = No profile role! The event profile role can't be blank.
error.message.EVENT_PROFILE_ACCESS_OUT_OF_EVENT_DATE_RANGE       = The event profile''s access dates ({0} to {1}) are outside the event ({2} to {3}). Adjust them!
error.message.EVENT_PROFILE_START_ACCESS_LATER_THAN_END_ACCESS   = Access end date can't be earlier than the start date. No time travel allowed! 🕰️
error.message.EVENT_PROFILE_USERS_EMPTY                          = Creating profiles without users? At least one user is needed!
error.message.EVENT_PROFILE_STATUS_NOT_ACCEPTED_OR_REJECTED      = The profile status must be either accepted or rejected. No compromises here!
error.message.EVENT_PROFILE_UPDATE_LAST_EVENT_ADMINISTRATOR      = You can''t modify the last admin of the event "{0}". At least one person needs to stay responsible! 👮
error.message.EVENT_PROFILE_DELETE_LAST_EVENT_ADMINISTRATOR      = Deleting the last admin for "{0}"? Are you sure you want to wreck the event? ⛓️‍💥
error.message.EVENT_PROFILE_UPDATE_ROLE_HIGHER_THAN_CURRENT_USER = You don''t have the rights to assign the role "{0}". Sorry! 🤷
error.message.EVENT_PROFILE_ALREADY_EXIST_ON_RANGE               = A profile already exists for the user(s) within the given timeframe. No duplicates, please! 🚫

error.message.MOVEMENT_DATETIME_NULL                             = The movement timestamp must be defined. Otherwise, how can we know when it happens?
error.message.MOVEMENT_DATETIME_OUT_OF_EVENT_DATE_RANGE          = The movement timestamp "{0}" is outside the event dates ({1} to {2}). Stay within limits!
error.message.MOVEMENT_TYPE_NULL                                 = The movement type must be defined. Otherwise, I won't know if it's an entry or an exit next time you ask.
error.message.MOVEMENT_CONTENT_EMPTY                             = Creating a movement without participants? Bring a team first!
error.message.MOVEMENT_CONTENT_PARTICIPANT_ID_NULL               = A participant in the movement is not specified.
error.message.MOVEMENT_PARTICIPANTS_NOT_FOUND_IN_MOVEMENT_EVENT  = A movement participant is not found in the event. Where did they go? 🤔
error.message.MOVEMENT_PARTICIPANTS_NOT_VISIBLE                  = A movement participant is disabled. Maybe check for updates?

error.message.PARTICIPANT_FIRST_NAME_NULL_OR_BLANK               = No way! An empty first name won't work.
error.message.PARTICIPANT_FIRST_NAME_TOO_LONG                    = The participant''s first name is too long. Keep it under {0}.
error.message.PARTICIPANT_LAST_NAME_NULL_OR_BLANK                = No way! An empty last name won't work.
error.message.PARTICIPANT_LAST_NAME_TOO_LONG                     = The participant''s last name is too long. Keep it under {0}.
error.message.PARTICIPANT_BIRTHDAY_NULL                          = People are usually born on a specific date. Please provide it!
error.message.PARTICIPANT_BIRTHDAY_FUTURE                        = Born in the future? Not in this world, sorry!
error.message.PARTICIPANT_START_LATER_THAN_END                   = The participant's arrival date can't be later than their departure date. No time travel allowed! 🕰️
error.message.PARTICIPANT_PRESENCE_DATES_OUT_OF_EVENT_DATE_RANGE = The participant''s presence dates ({0} to {1}) are outside the event ({2} to {3}). Adjust them!
error.message.PARTICIPANT_IN_EVENT_ALREADY_LINKED_TO_USER        = The user is already linked to the participant "{0}" in this event. No duplicates! 🚫
error.message.PARTICIPANT_GROUPS_NOT_FOUND_IN_PARTICIPANT_EVENT  = A participant group is not found in the event. Did it get lost? 🤔
error.message.PARTICIPANT_GROUPS_NOT_VISIBLE                     = A participant group is disabled. Check it out!
error.message.PARTICIPANT_DISABLE_LAST_GROUP_MEMBER              = Impossible to hide the last member of a group. A group with no members is less practical! 🤯
error.message.PARTICIPANT_DELETE_HAS_MOVEMENT                    = Impossible to delete a participant with associated movements. You have to delete them first! 🤓
error.message.PARTICIPANT_DELETE_LAST_GROUP_MEMBER               = Impossible to delete the last member of a group. A group with no members is less practical! 🤯

error.message.GROUP_NAME_NULL_OR_BLANK                           = No way! An empty name won't work.
error.message.GROUP_NAME_TOO_LONG                                = Did you see how long the name is? 🤯 Keep it under {0}.
error.message.GROUP_START_LATER_THAN_END                         = The group's arrival date can't be later than their departure date. No time travel allowed! 🕰️
error.message.GROUP_PRESENCE_DATES_OUT_OF_EVENT_DATE_RANGE       = The group''s presence dates ({0} to {1}) are outside the event ({2} to {3}). Adjust them!
error.message.GROUP_MEMBERS_EMPTY                                = Creating a group without members? This group needs reinforcements!
error.message.GROUP_MEMBERS_NOT_FOUND_IN_GROUP_EVENT             = A group member is not found in the event. Are you trying to confuse me?
error.message.GROUP_MEMBERS_ALREADY_ADDED                        = A group member is already added. No need to duplicate!
error.message.GROUP_MEMBERS_NOT_VISIBLE                          = A group member is disabled. Reactivate them to continue!
error.message.GROUP_LAST_MEMBERS_CANNOT_BE_REMOVED               = You can't remove the last member of the group. At least one person is needed!
