error.message.400                                                = Oops! Looks like your request isn't quite right. Please check and try again.
error.message.401                                                = You’re not logged in! Let’s fix that and get you connected.
error.message.403                                                = Sorry, you don’t have permission to access this. Maybe check with an admin?
error.message.404                                                = Hmm... We couldn’t find what you’re looking for. Did you type it right?
error.message.405                                                = Oops! This action isn’t allowed. Please check and try a different approach.
error.message.408                                                = This is taking longer than expected. Try again later or refresh the page.
error.message.409                                                = There’s a conflict with the data. Let’s make sure everything is up to date.
error.message.413                                                = Whoa! Your request is too big to handle. Try reducing the size.
error.message.414                                                = That’s a long URL! Let’s try making it a bit shorter.
error.message.415                                                = Oops! We can’t process that file type. Try uploading something different.
error.message.420                                                = Your connection seems slow. Please check your network and try again.
error.message.422                                                = We couldn’t process that data. Double-check it and try again.
error.message.424                                                = Something went wrong with an external system. Let’s try again later.
error.message.429                                                = Slow down! You’re making too many requests. Give it a moment and retry.
error.message.500                                                = Something broke on our end. We’re on it! Please try again in a bit.
error.message.501                                                = This feature isn’t available yet, but it’s on our to-do list!

error.message.NOT_IMPLEMENTED_YET                                = The feature isn’t ready yet... Patience, it’s on its way! 🚧
error.message.NO_PARAMETER_FOUND_FOR_SPECIFIED_NAME              = Couldn’t validate a parameter… It seems to be hiding because it’s nowhere to be found. 😅
error.message.COMPARING_WRONG_PARAMETER_TYPE                     = Comparing "{0}" and "{1}"? Impossible, they don’t even speak the same type!
error.message.NOT_FOUND_WITH_GIVEN_IDENTIFIER                    = Nothing found with the identifier "{0}". Are you sure it exists? 🤔
error.message.NOT_AUTHENTICATED                                  = Uh-oh, you’re not logged in. Log in to continue!
error.message.NOT_ENOUGH_PERMISSION                              = Tough luck, you don’t have the rights for this. Try with more permissions! 💪
error.message.PARAMETER_TYPE_MISMATCH                            = A parameter type mismatch 🤷
error.message.NOT_ACCEPTED_LANGUAGE_HEADER                       = The language specified in "Accept-Language" is not accepted. Available languages: {0}. Your move! 🌍
error.message.UNKNOWN_ERROR                                      = Unknown error: "{0}". Sorry, I cannot help you ! 🤷

error.message.AUTH_EMAIL_OR_ID_NOT_FOUND_IN_TOKEN                = The user email or ID is missing in the token. Ask your admin for help! 🕵️‍♂️
error.message.AUTH_BLOCKED_ACCOUNT                               = Looks like you messed up, your account is blocked. Not great, huh? 😕
error.message.AUTH_IMPERSONATED_ACCOUNT                          = Your account has been anonymized. Logging in is no longer an option…
error.message.REDIRECT_URI_BLANK                                 = The redirect URL can’t be blank. Yes, it’s essential! 🌐
error.message.AUTHORIZATION_CODE_BLANK                           = The authorization code is blank. Try a better approach. 🤔
error.message.AUTHORIZATION_CODE_OUTDATED                        = Your authorization code has expired. Back to square one! 🔄
error.message.REFRESH_TOKEN_BLANK                                = The refresh token is blank. No progress possible. 🚫
error.message.REFRESH_TOKEN_OUTDATED                             = Your refresh token has expired. Back to square one! 🔄
error.message.AUTH_PROVIDER_FAILED                               = The authentication provider encountered an unexpected issue. Not ideal, right? 🤷

error.message.USER_ASSIGNS_ROLE_HIGHER_THAN_ITS_OWN              = Seriously? You can’t assign a role "{0}" that’s higher than your own.
error.message.USER_UPDATE_LAST_APPLICATION_ADMINISTRATOR_ROLE    = You can’t update the last admin. An app without an admin is risky! 🤯
error.message.USER_BLOCK_LAST_APPLICATION_ADMINISTRATOR          = Blocking the last admin? Bad idea, trust me. 🔒
error.message.USER_IMPERSONATE_LAST_APPLICATION_ADMINISTRATOR    = You can’t anonymize the last admin. An admin-less app isn’t exactly ideal! 🤯
error.message.USER_DELETE_LAST_APPLICATION_ADMINISTRATOR         = Deleting the last admin? Are you sure you want to break everything? ⛓️‍💥
error.message.USER_BLOCK_LAST_EVENT_ADMINISTRATOR                = Blocking the last admin of "{0}"? That’s not going to help its administration. 🔒
error.message.USER_IMPERSONATE_LAST_EVENT_ADMINISTRATOR          = You can’t anonymize the last admin of "{0}". Events need responsible admins! 🤯
error.message.USER_DELETE_LAST_EVENT_ADMINISTRATOR               = Deleting the last admin of "{0}"? You might just ruin the event! ⛓️‍💥

error.message.EVENT_NAME_BLANK                                   = An event without a name? Seriously, give it an identity!
error.message.EVENT_NAME_TOO_LONG                                = Did you see the length of the name? 🤯 Keep it short, {0} characters max.
error.message.EVENT_BEGIN_LATER_THAN_END_TIME                    = End date before the start date? Do you have a time machine? 🕰️
error.message.EVENT_OPTIONS_MISSING                              = An option is missing. We can’t go on like this.
error.message.EVENT_DATE_CONFLICT_WITH_ELEMENTS                  = Sorry, but you can’t modify the event dates. There’s a conflict with an existing element in event "{0}"! 🤔

error.message.EVENT_PROFILE_ROLE_BLANK                           = The event profile role can’t be blank. Come on, give it some character!
error.message.EVENT_PROFILE_START_ACCESS_LATER_THAN_END_ACCESS   = The end access date can’t be before the start date. Time travel isn’t an option! 🕰️
error.message.EVENT_PROFILE_USERS_EMPTY                          = You can’t create profiles without users. You need at least one!
error.message.EVENT_PROFILE_STATUS_NOT_ACCEPTED_OR_REJECTED      = The profile status must be accepted or rejected. No middle ground here!
error.message.EVENT_PROFILE_UPDATE_LAST_EVENT_ADMINISTRATOR      = You can’t update the last admin of event "{0}". Someone has to stay responsible! 👮
error.message.EVENT_PROFILE_DELETE_LAST_EVENT_ADMINISTRATOR      = Deleting the last admin of "{0}"? Are you sure you want to break the event? ⛓️‍💥
error.message.EVENT_PROFILE_UPDATE_ROLE_HIGHER_THAN_CURRENT_USER = You don’t have the rights to assign the role "{0}". Sorry! 🤷
error.message.EVENT_PROFILE_ALREADY_EXIST_ON_RANGE               = A profile already exists for the user(s) for part of the specified period. No duplicates, thank you! 🚫

error.message.MOVEMENT_PARTICIPANT_NULL                          = A movement participant isn’t specified.
error.message.MOVEMENT_DATETIME_NULL                             = The movement timestamp must be defined. Otherwise, how will we know when it happened?
error.message.MOVEMENT_DATETIME_OUT_OF_EVENT_DATE_RANGE          = The movement timestamp "{0}" is outside the event dates ({1} to {2}). Let’s stay within bounds!
error.message.MOVEMENT_TYPE_NULL                                 = The movement type must be specified. Otherwise, I won’t know if it’s an entry or an exit next time you ask.
error.message.MOVEMENT_CONTENT_EMPTY                             = A movement without participants? Come back with a team!
error.message.MOVEMENT_PARTICIPANTS_NOT_FOUND_IN_MOVEMENT_EVENT  = A movement participant isn’t found in the event. Where did they go? 🤔
error.message.MOVEMENT_PARTICIPANTS_NOT_VISIBLE                  = A movement participant is deactivated. Maybe it needs an update?

error.message.PARTICIPANT_FIRST_NAME_BLANK                       = A participant without a first name? Not practical for identification!
error.message.PARTICIPANT_FIRST_NAME_TOO_LONG                    = The participant’s first name is too long. Keep it short, {0} characters max.
error.message.PARTICIPANT_LAST_NAME_BLANK                        = A participant without a last name? Not practical for identification!
error.message.PARTICIPANT_LAST_NAME_TOO_LONG                     = The participant’s last name is too long. Keep it short, {0} characters max.
error.message.PARTICIPANT_BIRTHDAY_FUTURE                        = Born in the future? Not in this world, sorry!
error.message.PARTICIPANT_START_LATER_THAN_END                   = A participant’s start date can’t be after the end date. Time travel isn’t allowed! 🕰️
error.message.PARTICIPANT_PRESENCE_DATES_OUT_OF_EVENT_DATE_RANGE = The participant’s presence dates ({0} to {1}) are outside the event dates ({2} to {3}). Adjust them!
error.message.PARTICIPANT_IN_EVENT_ALREADY_LINKED_TO_USER        = The user is already linked to participant "{0}" in this event. No duplicates! 🚫
error.message.PARTICIPANT_GROUPS_NOT_FOUND_IN_PARTICIPANT_EVENT  = A participant’s group isn’t found in the event. Did it get lost? 🤔
error.message.PARTICIPANT_GROUPS_NOT_VISIBLE                     = A participant’s group is deactivated. Check that!

error.message.GROUP_PARTICIPANT_NULL                             = A group member isn’t specified.
error.message.GROUP_NAME_BLANK                                   = The group name must be defined. No name, no group!
error.message.GROUP_NAME_TOO_LONG                                = The group name is too long. Keep it short, {0} characters max.
error.message.GROUP_START_LATER_THAN_END                         = The group’s start date can’t be after the end date. Time travel isn’t allowed! 🕰️
error.message.GROUP_PRESENCE_DATES_OUT_OF_EVENT_DATE_RANGE       = The group’s presence dates ({0} to {1}) are outside the event dates ({2} to {3}). Adjust them!
error.message.GROUP_MEMBERS_EMPTY                                = You can’t create a group without members. This group needs some recruits!
error.message.GROUP_MEMBERS_NOT_FOUND_IN_GROUP_EVENT             = A group member isn’t found in the event. Are you trying to confuse me?
error.message.GROUP_MEMBERS_ALREADY_ADDED                        = A group member is already added. No need to duplicate!
error.message.GROUP_MEMBERS_NOT_VISIBLE                          = A group member is deactivated. Reactivate them to proceed!
error.message.GROUP_LAST_MEMBERS_CANNOT_BE_REMOVED               = You can’t remove the last member of the group. Someone has to stay!
