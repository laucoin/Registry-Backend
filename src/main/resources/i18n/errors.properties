error.title.400=\uD83D\uDE43\u00A0Invalid request
error.title.401=\uD83D\uDE30\u00A0You\u2019re not logged in
error.title.403=\uD83D\uDC6E\u00A0Prohibited action
error.title.404=\uD83E\uDDD0\u00A0Not found
error.title.405=\uD83E\uDD14\u00A0Method not allowed
error.title.408=\u231A\u00A0Request timeout
error.title.409=\uD83E\uDD2F\u00A0Conflict
error.title.413=\uD83E\uDEE3\u00A0Request too large
error.title.414=\uD83E\uDEE3\u00A0URI too long
error.title.415=\uD83D\uDE07\u00A0Unsupported file type
error.title.420=\uD83D\uDEA3\u00A0Connection too weak
error.title.422=\uD83D\uDE05\u00A0Unprocessable Data
error.title.423=\uD83D\uDD12\u00A0Locked
error.title.424=\uD83D\uDE31\u00A0External dependency error
error.title.429=\uD83E\uDD3F\u00A0Too many requests
error.title.500=\uD83D\uDE36\u00A0Server error
error.title.501=\uD83E\uDDEA\u00A0Not implemented
error.message.400=Looks like your request is invalid (maybe due to invalid or missing data). Check the details and try again\u00A0\uD83E\uDD14.
error.message.401=Get connected! If you\u2019re already logged in, try logging in again\u00A0\uD83D\uDD10.
error.message.403=You don\u2019t have permission to access this resource\u00A0\uD83D\uDEAB. Contact your project admin if needed.
error.message.404=Hmm\u2026 Can\u2019t find what you\u2019re looking for\u00A0\uD83D\uDD0D. Are you sure it exists?
error.message.405=The method used is not supported. Try another method\u00A0\uD83D\uDED1.
error.message.408=This is taking longer than expected\u00A0\u23F3. Try refreshing or come back later.
error.message.409=There is a conflict. Check the data sent and try again\u00A0\u26A0\uFE0F.
error.message.413=Whoa! Your request is too large\u00A0\uD83D\uDC33. Try reducing its size.
error.message.414=The URL is too long. Shorten it and try again\u00A0\uD83D\uDD17.
error.message.415=The file format sent is not supported\u00A0\uD83D\uDCC2. Use a supported format!
error.message.420=Your connection is weak\u00A0\uD83D\uDC22 get closer to the box. If you\u2019re on 4G, get closer to a window. If you\u2019re on 3G, get closer to another century.
error.message.422=The data sent is incomplete or incorrect\u00A0\uD83D\uDCCB. Check and try again!
error.message.424=A necessary external dependency crashed. Try again later\u00A0\uD83D\uDD04.
error.message.429=You\u2019ve sent too many requests in a short time. Try again later\u00A0\uD83D\uDD70\uFE0F.
error.message.500=An unexpected error has occurred, and we are working to resolve it\u00A0\uD83D\uDEE0\uFE0F. If the error persists, don\u2019t hesitate to let us know.
error.message.501=This feature is not yet available. Be patient\u00A0\u23F3 it\u2019s coming soon!
error.message.NOT_IMPLEMENTED_YET=This feature is not yet available. Be patient \u23F3 it\u2019s coming soon!
error.message.NO_PARAMETER_FOUND_FOR_SPECIFIED_NAME=Impossible to verify data... it can\u2019t be found\u00A0\uD83D\uDD75\uFE0F\u200D\u2642\uFE0F.
error.message.COMPARING_WRONG_PARAMETER_TYPE=You can\u2019t compare carrots\u00A0\uD83E\uDD55 and ribs\u00A0\uD83E\uDD69. The parameters (\u201C{0}\u201D and \u201C{1}\u201D) are not comparable.
error.message.NOT_FOUND_WITH_GIVEN_IDENTIFIER=Hmm\u2026 We can\u2019t find anything with the identifier \u201C{0}\u201D \uD83D\uDD0D. Are you sure it exists?
error.message.INVALID_TOKEN=Your token is invalid or expired. You should refresh it!\u00A0\uD83D\uDD04
error.message.NOT_AUTHENTICATED=Get connected! If you\u2019re already logged in, try logging in again\u00A0\uD83D\uDD10.
error.message.FAILED_TO_LOGIN_FOR_UNKNOWN_REASON=Gosh! An unknown error has occurred during connection\u00A0\uD83D\uDE31. Try again later or contact the administrator.
error.message.NOT_ENOUGH_PERMISSION=You don\u2019t have the rights! You can ask Chuck Norris for help to force your way in, but I doubt it\u2019ll be enough.\u00A0\uD83D\uDE0F
error.message.PARAMETER_TYPE_MISMATCH=You sent me a ribs \uD83E\uDD69 when I was expecting carrots \uD83E\uDD55. The data type is incorrect.
error.message.DATE_IS_NULL=If you send me a timestamp\u00A0\uD83D\uDCC6 at least the date must be defined.
error.message.TIME_IS_SET_BUT_NOT_DATE=If you send me a timestamp\u00A0\uD83D\uDCC6. Time cannot be defined without date. It\u2019s like if I give you an appointment at 3:30\u00A0pm without specifying the day, do you see the problem?
error.message.PAGE_SIZE_IS_LOWER_THAN_ONE=You\u2019ve just invented quantum paging\u00A0\uD83D\uDC4F. This page exists and doesn\u2019t exist at the same time. You do realize that a page with a size of less than 1 is complicated to calculate?
error.message.PAGE_SIZE_IS_UPPER_THAN_MAX_PAGE_SIZE=We send you pages, not encyclopedias\u00A0\uD83E\uDD23! The maximum size of a page is \u201C{0}\u201D.
error.message.PAGE_NUMBER_IS_LOWER_THAN_ZERO=Error 404? No, error -404! Negative page number?
error.message.UNKNOWN_ERROR=An unexpected error has occurred, and we are working to resolve it\u00A0\uD83D\uDEE0\uFE0F. If the error persists, don\u2019t hesitate to let us know.
error.message.AUTH_EMAIL_OR_ID_NOT_FOUND_IN_TOKEN=Unable to retrieve connection information from third party \uD83D\uDD75\uFE0F\u200D\u2642\uFE0F.
error.message.AUTH_BLOCKED_ACCOUNT=Your account has been blocked. Contact an administrator for more information\u00A0\uD83D\uDCAC.
error.message.AUTH_IMPERSONATED_ACCOUNT=Your account has been anonymized\u00A0\uD83E\uDDFD. So it\u2019s impossible to log in.
error.message.AUTH_EMAIL_ALREADY_USED=E-mail address {0} is already being used by another account. If you think this is a mistake, contact your project administrator.
error.message.REDIRECT_URI_BLANK=The redirect URL can\u2019t be blank. Yes, it\u2019s essential!\u00A0\uD83C\uDF10.
error.message.AUTHORIZATION_CODE_BLANK=The code used to obtain an authentication token is empty\u00A0\uD83E\uDD14. No code, no token! If the problem persists, reconnect.
error.message.AUTHORIZATION_CODE_OUTDATED=The code used to obtain an authentication token has expired\u00A0\uD83E\uDD14. No valid code, no token! If the problem persists, reconnect.
error.message.REFRESH_TOKEN_OUTDATED=The code used to renew the authentication token has expired\u00A0\uD83E\uDD14. No valid code, no token! If the problem persists, reconnect.
error.message.AUTH_PROVIDER_FAILED=The third party that connects you has encountered an unexpected error. Unfortunately, without it you\u2019re not connected, and without a connection you can\u2019t access\u00A0\u26D4\uFE0F.
error.message.USER_ASSIGNS_ROLE_HIGHER_THAN_ITS_OWN=The role \u201C{0}\u201D is superior to yours\u00A0\uD83E\uDEE1. You cannot assign it.
error.message.USER_UPDATE_LAST_APPLICATION_ADMINISTRATOR_ROLE=You\u2019re changing the role of the last application administrator\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to repair the application (and I\u2019m lazy), so no.
error.message.USER_BLOCK_LAST_APPLICATION_ADMINISTRATOR=You\u2019re blocking the last application administrator\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to repair the application (and I\u2019m lazy) so no.
error.message.USER_IMPERSONATE_LAST_APPLICATION_ADMINISTRATOR=You\u2019re anonymizing the application\u2019s last administrator\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to repair the application (and I\u2019m lazy) so no. If you really want to do this, you can name another administrator and then you can try anonymizing this one again.
error.message.USER_DELETE_LAST_APPLICATION_ADMINISTRATOR=You\u2019re deleting the application\u2019s last administrator\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to repair the application (and I\u2019m lazy) so no. If you really want to do this, you can name another administrator and then you can try anonymizing this one again.
error.message.USER_BLOCK_CURRENT_USER=I won\u2019t judge you, but blocking your account is not the idea of the century\u00A0\uD83E\uDD26\u200D\u2640\uFE0F.
error.message.USER_IMPERSONATE_CURRENT_USER=You can\u2019t anonymize your account this way. Go to settings.\u00A0\uD83D\uDD75\uFE0F\u200D\u2642\uFE0F
error.message.USER_DELETE_CURRENT_USER=No judgment, but deleting your own account is not the idea of the century \uD83E\uDD2F. If you want to leave the application go through the preferences and anonymize your account. It will be automatically deleted later.
error.message.USER_BLOCK_LAST_PROJECT_ADMINISTRATOR=You\u2019re blocking the last administrator of the project \u201C{0}\u201D\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to fix the project (and I\u2019m lazy) so no.
error.message.USER_IMPERSONATE_LAST_PROJECT_ADMINISTRATOR=You\u2019re anonymizing the last administrator of project \u201C{0}\u201D\u00A0\uD83E\uDD2F. If I let you do that, I\u2019ll have to fix the project (and I\u2019m lazy) so no. If you really want to do this, you can appoint another administrator OR delete the project and then you can try anonymizing it again.
error.message.USER_DELETE_LAST_PROJECT_ADMINISTRATOR=You\u2019re deleting the last administrator the project \u201C{0}\u201D\u00A0\uD83E\uDD2F. If I let you do that, I\u2019ll have to fix the project (and I\u2019m lazy) so no. If you really want to do this, you can name another administrator OR delete the project so you can try deleting it again.
error.message.PROJECT_NAME_NULL_OR_BLANK=The project must have a name. Isn\u2019t it easier to know which one we\u2019re talking about?\u00A0\uD83D\uDE05
error.message.PROJECT_NAME_TOO_LONG=Your project name is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.PROJECT_BEGIN_LATER_THAN_END_TIME=Your project can\u2019t possibly end before it begins\u00A0\uD83D\uDE2C. If you can do it, you\u2019ve got a time machine\u00A0\uD83D\uDD70\uFE0F.
error.message.PROJECT_OPTIONS_MISSING=Your project is missing an option. To activate \u201C{0}\u201D, you absolutely need \u201C{1}\u201D. Otherwise the application won\u2019t like it\u00A0\uD83E\uDD2F.
error.message.PROJECT_DATE_CONFLICT_WITH_ELEMENTS=The new \u201C{0}\u201D project dates conflict with at least one existing element\u00A0\uD83E\uDD2F. You can modify the dates of your project, but only within the limits of the elements already created. Otherwise, you must delete them.
error.message.PROJECT_PROFILE_ROLE_BLANK=A project access profile must have a specified role. No role, no profile.
error.message.PROJECT_PROFILE_START_ACCESS_LATER_THAN_END_ACCESS=Access to the profile can\u2019t possibly end before it begins\u00A0\uD83D\uDE2C. If you can do it, you\u2019ve got a time machine\u00A0\uD83D\uDD70\uFE0F.
error.message.PROJECT_PROFILE_USERS_EMPTY=You want to create one or more access profiles for a project. But to do so, you must specify for which users\u00A0\uD83E\uDDD1\u200D\uD83D\uDCBB you want to create them.
error.message.PROJECT_PROFILE_STATUS_NOT_ACCEPTED_OR_REJECTED=To accept or reject a profile, you need to send the right status\u00A0\uD83D\uDE05.
error.message.PROJECT_PROFILE_UPDATE_LAST_PROJECT_ADMINISTRATOR=You\u2019re changing the last administrator role of the project \u201C{0}\u201D\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to fix the project (and I\u2019m lazy) so no.
error.message.PROJECT_PROFILE_BLOCK_LAST_PROJECT_ADMINISTRATOR=You\u2019re blocking the last administrator of the \u201C{0}\u201D project\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to fix the project (and I\u2019m lazy) so no.
error.message.PROJECT_PROFILE_DELETE_LAST_PROJECT_ADMINISTRATOR=You\u2019re deleting the last administrator the project \u201C{0}\u201D\u00A0\uD83E\uDD2F. If I let you do that, I\u2019ll have to fix the project (and I\u2019m lazy) so no. If you really want to do this, you can name another administrator OR delete the project so you can try deleting it again.
error.message.PROJECT_PROFILE_UPDATE_ROLE_HIGHER_THAN_CURRENT_USER=You can\u2019t update a profile with a higher role than yours\u00A0\uD83D\uDC6E.
error.message.PROJECT_PROFILE_ASSIGNS_ROLE_HIGHER_THAN_CURRENT_USER=The role \u201C{0}\u201D is superior to your profile \uD83E\uDEE1. So you can\u2019t assign it.
error.message.PROJECT_PROFILE_ALREADY_EXIST_ON_RANGE=A profile already exists for at least one user over the specified period. To avoid loss of clarity, it is not possible for a person to have more than one profile over the same period\u00A0\uD83D\uDC40.
error.message.PARTICIPANT_FIRST_NAME_NULL_OR_BLANK=The participant must have a first name. Isn\u2019t it more convenient to call him?\u00A0\uD83D\uDE05
error.message.PARTICIPANT_FIRST_NAME_TOO_LONG=The participant\u2019s first name is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.PARTICIPANT_LAST_NAME_NULL_OR_BLANK=The participant must have a surname. Doesn\u2019t everyone?\u00A0\uD83D\uDE05
error.message.PARTICIPANT_LAST_NAME_TOO_LONG=The participant\u2019s surname is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.PARTICIPANT_BIRTHDAY_NULL=The participant must have a date of birth. Doesn\u2019t everyone?\u00A0\uD83D\uDE05
error.message.PARTICIPANT_BIRTHDAY_FUTURE=It may not be very inclusive, but we only accept participants who have already been born\u00A0\uD83E\uDD30. Don\u2019t make a fuss, pregnant women are welcome, it\u2019s just that birth dates in the future less so.
error.message.PARTICIPANT_START_LATER_THAN_END=A participant\u2019s departure date cannot decently be before their arrival date\u00A0\uD83D\uDE2C. If you can do it, you\u2019ve got a time machine\u00A0\uD83D\uDD70\uFE0F.
error.message.PARTICIPANT_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=At least one participant attendance date (\u201C{0}\u201D to \u201C{1}\u201D) is outside the project dates (\u201C{2}\u201D to \u201C{3}\u201D). Personally, I don\u2019t think this makes sense\u00A0\uD83E\uDD2F. To mean that a participant is present throughout the project, it\u2019s best not to specify their dates of presence\u00A0\uD83D\uDCA1.
error.message.PARTICIPANT_IN_PROJECT_ALREADY_LINKED_TO_USER=The user is already linked to participant \u201C{0}\u201D in this project. No duplicates!\u00A0\uD83D\uDEAB
error.message.PARTICIPANT_OUT_OF_MOVEMENT_DATETIME=The participant\u2019s new dates conflict with the \u201C{0}\u201D movement linked to it\u00A0\uD83E\uDD2F. You can modify a participant\u2019s dates, but only within the limits of the movements already created. Otherwise, you must delete them.
error.message.PARTICIPANT_GROUPS_NOT_FOUND_IN_PARTICIPANT_PROJECT=At least one participant group cannot be found in the project\u00A0\uD83D\uDE48. Check the groups you have entered and try again.
error.message.PARTICIPANT_GROUPS_NOT_VISIBLE=At least one of the participant\u2019s groups is masked. A hidden group\u00A0\uD83D\uDE37 cannot be added to a participant.
error.message.PARTICIPANT_DISABLE_LAST_GROUP_MEMBER=You\u2019re hiding the last participant in a group\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to repair the group (and I\u2019m lazy) so no.
error.message.PARTICIPANT_DELETE_HAS_MOVEMENT=You\u2019re deleting a participant who already has at least one movement\u00A0\uD83C\uDFC3. If I let you, we\u2019ll lose information from the history, which isn\u2019t possible until the project is finished.
error.message.PARTICIPANT_DELETE_LAST_GROUP_MEMBER=You\u2019re deleting the last member of a group\u00A0\uD83E\uDD2F. If I let you, I\u2019ll have to repair the group (and I\u2019m lazy) so no. If you really want to do this, you can delete the group and try again\u00A0\uD83D\uDCA1.
error.message.MOVEMENT_DATETIME_NULL=The movement must have a time stamp. Isn\u2019t it convenient to know when it takes place?\u00A0\uD83D\uDE05
error.message.MOVEMENT_DATETIME_OUT_OF_PROJECT_DATE_RANGE=The movement timestamp \u201C{0}\u201D is outside the project dates (\u201C{1}\u201D to \u201C{2}\u201D). Personally, I don\u2019t think this makes sense\u00A0\uD83E\uDD2F. You can create a movement linked to a project as long as the date of your movement is included in the dates of your project.
error.message.MOVEMENT_TYPE_NULL=The movement must have a type. Isn\u2019t it more practical to know if it\u2019s an input or an output?\u00A0\uD83D\uDE05
error.message.MOVEMENT_CONTENT_EMPTY=The movement must have participants. Without participants there is no movement, if\u00A0?\u00A0\uD83D\uDE05
error.message.MOVEMENT_CONTENT_PARTICIPANT_ID_NULL=It seems that in the content specified for the movement, the identifier of a participant is missing.\u00A0\uD83D\uDC40
error.message.MOVEMENT_ODD_GUEST_CONTENT=It is not possible to create guests to create an outing. In fact, a guest who goes out must have come in\u00A0\uD83D\uDE48\u00A0? So if he\u2019s in, you have to let him out by giving his ID to avoid duplicates.
error.message.MOVEMENT_REMOVE_GUEST_CONTENT=You\u2019ve removed at least one guest by modifying the movement. This is not possible\u00A0\u26D4\uFE0F! We\u2019re assuming that you had the information to let him in, which means he was there. So you can take him out\u00A0\uD83D\uDE09.
error.message.MOVEMENT_PARTICIPANTS_NOT_FOUND_IN_MOVEMENT_PROJECT=At least one movement participant cannot be found in the project. Check the participants entered and their dates of attendance\u00A0\uD83D\uDCC6 then try again.
error.message.MOVEMENT_PARTICIPANTS_NOT_VISIBLE=At least one participant in the movement is masked. A masked participant\u00A0\uD83D\uDE37 cannot be included in a movement.
error.message.MOVEMENT_DRIVERS_NOT_MAJOR=At least one driver in the movement is underage. It\u2019s a major problem if a minor is driving\u00A0\uD83D\uDE05.
error.message.MOVEMENT_VEHICLES_NOT_FOUND_IN_MOVEMENT_PROJECT=At least one movement vehicle cannot be found in the project. Check the vehicles entered and their dates of presence\u00A0\uD83D\uDCC6 then try again.
error.message.MOVEMENT_VEHICLES_NOT_VISIBLE=At least one vehicle in the movement is masked. A masked vehicle\u00A0\uD83D\uDE37 cannot be included in a movement.
error.message.MOVEMENT_TYPE_AND_REASON_ARE_INCOMPATIBLE=The type and motif of the movement are incompatible. No reason for guests leaving or registered participants entering. In other cases, a reason is required and these are not common between registered participants and guests\u00A0\uD83E\uDD2F.
error.message.MOVEMENT_ACTIVITY_AND_REASON_ARE_DEFINED=An activity is in essence an exit reason so you can\u2019t specify an activity AND an exit reason\u00A0\uD83D\uDE2C.
error.message.MOVEMENT_ACTIVITY_NOT_FOUND_IN_MOVEMENT_PROJECT=The movement activity cannot be found in the project. Check the activity entered and its attendance dates\u00A0\uD83D\uDCC6 then try again.
error.message.MOVEMENT_ACTIVITY_NOT_VISIBLE=Movement activity is masked. A masked activity\u00A0\uD83D\uDE37 cannot be included in a movement.
error.message.MOVEMENT_COMMUNICATION_OUT_OF_MOVEMENT_DATETIME=The movement\u2019s new timestamp is after \u201C{0}\u201D communications linked to it\u00A0\uD83E\uDD2F. You can modify a movement\u2019s timestamp, but only within the limits of the communications already created. Otherwise, you must delete them.
error.message.MOVEMENT_UPDATE_CHANGE_TYPE=It is not possible to change the type of a movement. In other words, an input cannot become an output. If you\u2019ve made a mistake, please hide/delete the movement and recreate it in the correct direction.a
error.message.MOVEMENT_UPDATE_CHANGE_CONTENT_TYPE=It is not possible to change the type of participant. In other words, you can\u2019t change from registered participant to guest.
error.message.MOVEMENT_CANNOT_BE_UPDATED=A final departure or guest exit cannot be modified?.
error.message.MOVEMENT_CANNOT_BE_DISABLED=A final departure or guest exit cannot be masked?.
error.message.MOVEMENT_CANNOT_BE_ENABLED=A final departure or guest exit is not unmaskable?.
error.message.MOVEMENT_CANNOT_BE_DELETED=A final departure or guest exit cannot be deleted?.
error.message.GROUP_NAME_NULL_OR_BLANK=The group must have a name. Isn\u2019t it easier to identify it without having to remember an identifier like \u201Ce7da4aed-3dac-4b32-92a3-786cb7a373b8\u201D?\u00A0\uD83D\uDE05
error.message.GROUP_NAME_TOO_LONG=The group name is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.GROUP_START_LATER_THAN_END=A band\u2019s departure date cannot decently be before its arrival date\u00A0\uD83D\uDE2C. If you can do that, you\u2019ve got a time machine\u00A0\uD83D\uDD70\uFE0F.
error.message.GROUP_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=At least one date of the group\u2019s presence (\u201C{0}\u201D to \u201C{1}\u201D) is outside the project dates (\u201C{2}\u201D to \u201C{3}\u201D). Personally, I don\u2019t think this makes sense\u00A0\uD83E\uDD2F. To mean that a group is present throughout the project, it\u2019s best not to specify its dates of presence\u00A0\uD83D\uDCA1.
error.message.GROUP_MEMBERS_EMPTY=It\u2019s impossible to create a group without a member\u00A0\uD83E\uDDB5. And it doesn\u2019t make sense anyway, does it?
error.message.GROUP_MEMBERS_NOT_FOUND_IN_GROUP_PROJECT=At least one group member cannot be found in the project\u00A0\uD83D\uDE48. Check the participants entered and try again.
error.message.GROUP_MEMBERS_ALREADY_ADDED=At least one participant was already in the group\u00A0\uD83E\uDD2F. Check the participants you\u2019ve entered and try again.
error.message.GROUP_MEMBERS_NOT_VISIBLE=At least one participant is masked. A masked participant\u00A0\uD83D\uDE37 cannot be added to a group.
error.message.GROUP_LAST_MEMBERS_CANNOT_BE_REMOVED=The last member of the group cannot be removed. If you really want to do this, you can delete the group directly\u00A0\uD83D\uDCA1.
error.message.VEHICLE_LICENSE_PLATE_NULL_OR_BLANK=The vehicle must have a license plate. Is it mandatory to take the road anyway?\u00A0\uD83D\uDE05
error.message.VEHICLE_LICENSE_PLATE_TOO_LONG=Vehicle license plate is too long \uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.VEHICLE_BRAND_NULL_OR_BLANK=The vehicle must be branded. Even if it is controversial, it still exists?\u00A0\uD83D\uDE05
error.message.VEHICLE_BRAND_TOO_LONG=The vehicle brand name is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.VEHICLE_MODEL_NULL_OR_BLANK=The vehicle must have a model. Even if it\u2019s a multiplat, we\u2019ll accept it.\u00A0\uD83D\uDE05
error.message.VEHICLE_MODEL_TOO_LONG=The vehicle model name is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.VEHICLE_START_LATER_THAN_END=The departure date of a vehicle cannot decently be before its arrival date\u00A0\uD83D\uDE2C. If you can do that, you\u2019ve got a time machine\u00A0\uD83D\uDD70\uFE0F.
error.message.VEHICLE_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=At least one vehicle presence date (\u201C{0}\u201D to \u201C{1}\u201D) is outside the project dates (\u201C{2}\u201D to \u201C{3}\u201D). Personally, I don\u2019t think this makes sense\u00A0\uD83E\uDD2F. To mean that a vehicle is present throughout the project, it\u2019s best not to specify its dates of presence\u00A0\uD83D\uDCA1.
error.message.VEHICLE_DELETE_HAS_MOVEMENT=You\u2019re deleting a vehicle that already has at least one movement\u00A0\uD83D\uDE97. If I let you, we\u2019ll lose information from the history, which isn\u2019t possible until there\u2019s a statute of limitations for possible traffic violations\u00A0\uD83D\uDE94.
error.message.ACTIVITY_NAME_NULL_OR_BLANK=The activity must have a name. Isn\u2019t it easier to identify it without having to remember an identifier like \u201Ce7da4aed-3dac-4b32-92a3-786cb7a373b8\u201D?\u00A0\uD83D\uDE05
error.message.ACTIVITY_NAME_TOO_LONG=The activity name is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.ACTIVITY_DESCRIPTION_TOO_LONG=The activity description is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.ACTIVITY_DURATION_FORMAT_FAILED=The activity duration specified is in the wrong format\u00A0\uD83D\uDE07. Only ISO 8601 format accepted\u00A0\uD83D\uDCA1.
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_NULL=It seems that in the range of the number of participants specified for the activity, the maximum or minimum is not defined.\u00A0\uD83D\uDC40
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_TOO_LOW=No judgement, but how can you do an activity with a minimum of 0 participants\u00A0\uD83E\uDE84? Logic would dictate at least one participant to do an activity.
error.message.ACTIVITY_ALLOWED_PARTICIPANTS_MAX_IS_HIGHER_THAN_MIN=Within the range of activity participants, the maximum can obviously not be less than the minimum\u00A0\uD83E\uDD2F.
error.message.ACTIVITY_START_LATER_THAN_END=An activity\u2019s availability end date cannot decently be before its availability start date\u00A0\uD83D\uDE2C. If you can do that, you\u2019ve got a time machine\u00A0\uD83D\uDD70\uFE0F.
error.message.ACTIVITY_PRESENCE_DATES_OUT_OF_PROJECT_DATE_RANGE=At least one activity availability date (\u201C{0}\u201D to \u201C{1}\u201D) is outside the project dates (\u201C{2}\u201D to \u201C{3}\u201D). Personally, I don\u2019t think this makes sense\u00A0\uD83E\uDD2F. To mean that an activity is available throughout the project, it\u2019s best not to specify its availability dates\u00A0\uD83D\uDCA1.
error.message.ACTIVITY_DELETE_HAS_MOVEMENT=You\u2019re deleting an activity that already has at least one movement\u00A0\uD83C\uDFC3. If I let you do this, we\u2019ll lose information from the history, which isn\u2019t possible until the project is finished.
error.message.COMMUNICATION_DATETIME_NULL=Communication must be time-stamped. Isn\u2019t it convenient to know when it takes place?\u00A0\uD83D\uDE05
error.message.COMMUNICATION_DATETIME_OUT_OF_PROJECT_DATE_RANGE=The communication timestamp \u201C{0}\u201D is outside the project dates (\u201C{1}\u201D to \u201C{2}\u201D). Personally, I don\u2019t think this makes sense\u00A0\uD83E\uDD2F. You can create a communication linked to a project as long as the date of your communication is within the dates of your project.
error.message.COMMUNICATION_MOVEMENT_IS_AFTER_COMMUNICATION=The communcation timestamp is before that of the movement to which it is linked\u00A0\uD83E\uDD2F.
error.message.COMMUNICATION_MESSAGE_TOO_LONG=The communication message is too long\u00A0\uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.COMMUNICATION_MOVEMENT_OR_ALERT_NULL=Communication must be linked to a movement. Isn\u2019t it convenient to know with whom the exchange is taking place?\u00A0\uD83D\uDE05
error.message.COMMUNICATION_MOVEMENT_NOT_FOUND_IN_COMMUNICATION_PROJECT=The movement cannot be found in the project\u00A0\uD83D\uDE48. Check the movement you\u2019ve entered and try again.
error.message.COMMUNICATION_MOVEMENT_NOT_VISIBLE=The movement attached to the communication is deactivated. Check this!
error.message.COMMUNICATION_MOVEMENT_CONTENT_TYPE_NOT_REGISTERED=Communications are only possible with registered participant movements\u00A0\u270D\uFE0F. This makes it possible to trace exchanges with participants outside the project enclosure\u00A0\uD83D\uDE09.
error.message.COMMUNICATION_MOVEMENT_TYPE_NOT_OUT=Communications are only possible with outputs\u00A0\uD83D\uDEAA. Indeed, it makes no sense to trace exchanges with participants who are inside the project enclosure.
error.message.COMMUNICATION_ALERT_IS_AFTER_COMMUNICATION=The communcation timestamp is before that of the alert to which it is linked\u00A0\uD83E\uDD2F.
error.message.COMMUNICATION_ALERT_IS_NOT_COMPATIBLE_WITH_COMMUNICATION_CREATION=Alert status is incompatible with communication creation \uD83E\uDD2F. You can only add a communication to alerts in progress.
error.message.COMMUNICATION_ALERT_NOT_VISIBLE=The alert attached to the communication is deactivated. Check this!
error.message.ALERT_TITLE_NULL_OR_BLANK=The alert must have a title. Wouldn\u2019t it be more practical to identify it without retaining an identifier like \u201Ce7da4aed-3dac-4b32-92a3-786cb7a373b8\u201D? \uD83D\uDE05
error.message.ALERT_TITLE_TOO_LONG=The alert title is too long \uD83D\uDE07. There has to be a limit, and it\u2019s set at \u201C{0}\u201D for this field.
error.message.ALERT_STATUS_NULL=The alert must have a status. Wouldn\u2019t it be more practical to know if it\u2019s still current? \uD83D\uDE05
error.message.ALERT_DATETIME_OUT_OF_PROJECT_DATE_RANGE=The timestamp of the \u201C{0}\u201D alert is outside the project dates (\u201C{1}\u201D to \u201C{2}\u201D). Personally, I don\u2019t think this makes sense \uD83E\uDD2F. You can create an alert linked to a project as long as the date of your alert is included in the dates of your project.
error.message.ALERT_COMMUNICATION_OUT_OF_ALERT_DATETIME=The new timestamp new dates for alert \u201C{0}\u201D is after at least one related communication \uD83E\uDD2F. You can modify the timestamp of an alert, but only within the limit of the communications associated with it. Otherwise, you must delete them.
error.message.ALERT_DELETE_HAS_COMMUNICATION=You\u2019re deleting an alert that already has at least one communication \uD83C\uDFC3. If I let you do this, we\u2019ll lose information from the history, which isn\u2019t possible until the project is finished.
error.message.ALERT_STATUS_IS_NOT_UPDATABLE=The alert you are trying to modify has a status that makes it unmodifiable. Check the alert status and try again \uD83E\uDD14.
error.message.PURGE_DATE_THRESHOLD_IN_FUTURE=A purge threshold in the future means everything is \u201Cold enough\u201D \u2014 the whole registry would be swept away\u00A0\uD83E\uDDF9. Pick a date that has already happened.
error.message.REFRESH_COOKIE_MISSING=Your session has no renewal cookie \u2014 it expired, or you signed out in another tab \uD83C\uDF6A. Sign in again and you\u2019re back.
error.message.REDIRECT_URI_NOT_ALLOWED=That return address is not one of ours \uD83D\uDEAB. We only send you back to Registry, never anywhere else.
error.message.STATE_BLANK=The sign-in is missing the token that ties it to your browser \uD83E\uDDF5. Start again from the login page.
error.message.STATE_MISMATCH=This sign-in does not match the one started in this browser \uD83D\uDD75\uFE0F. It may have expired, or it was not you who started it. Start again from the login page.
