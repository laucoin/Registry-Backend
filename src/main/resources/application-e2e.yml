# End-to-end profile — activate with `-Dspring.profiles.active=e2e`
# (or SPRING_PROFILES_ACTIVE=e2e). Exists exclusively to run the Registry-E2E
# suite against this backend; never enable it in production.
#
# It carries the rate-limit override and nothing else — in particular NOT the
# seed dataset. Registry-E2E stands the stack up on the versioned migrations
# only and seeds its own fixtures (ci/seed/seed.sql); loading the huge dataset
# would TRUNCATE tb_user underneath them. Combine profiles when both are
# wanted, e.g. SPRING_PROFILES_ACTIVE=local,e2e.

registry:
  security:
    rate-limit:
      # ADR 019 — `capacity: 0` disables the limiter. The end-to-end suite drives
      # hundreds of writes back to back, and the production defaults (20 sensitive
      # calls per minute, 60 searches) throttle it well before it finishes: the
      # sensitive bucket empties on the disable/block operations the journeys
      # chain, and each refusal both fails its own test and strands partial state
      # that fails others. The limiter is exercised by its own targeted tests
      # rather than by every journey incidentally.
      sensitive:
        capacity: 0
      search:
        capacity: 0
