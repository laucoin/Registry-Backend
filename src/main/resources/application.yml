logging:
  level:
    fr.laucoin.registry.backend: ${REGISTRY_LOGGING_LEVEL:INFO}
    org.springframework.web: ${REGISTRY_LOGGING_LEVEL:INFO}
    org.springframework.security.oauth2: ${REGISTRY_LOGGING_LEVEL:INFO}
    org.springframework.security.oauth2.client: ${REGISTRY_LOGGING_LEVEL:INFO}
    org.flywaydb: ${REGISTRY_LOGGING_LEVEL:INFO}

server:
  port: ${REGISTRY_SERVER_PORT:8081}

external:
  cors:
    urls: ${EXTERNAL_CORS_URLS}

registry:
  performance:
    # In-process caching knobs. TTLs bound per-replica staleness;
    # 0 disables the count cache entirely.
    count-cache-ttl-seconds: ${REGISTRY_PERFORMANCE_CACHE_TTL_SECONDS:30}
    roles-max-age-seconds: ${REGISTRY_PERFORMANCE_MAX_AGE_ROLES_SECONDS:600}
    metadata-max-age-seconds: ${REGISTRY_PERFORMANCE_MAX_AGE_METADATA_SECONDS:300}
  information:
    name: Registry
    description: This application allows virtual registry management. This is a backend which one is called by the frontend.
    locale:
      default: en
      supported: en,fr
    support:
      name: Luc AUCOIN
      email: luc.aucoin1998@gmail.com
      url: https://doc.laucoin.fr/registry/
  feature:
    observability:
      enabled: true
    light-user:
      # Email-only accounts with no oidc_id: invitations by email, and the
      # first-login linking that claims them. Disabled turns the mechanism off
      # end to end — an unknown email can no longer be invited, and a sign-in
      # that would have linked an unclaimed invitation drops it and
      # self-registers instead.
      enabled: ${REGISTRY_FEATURE_LIGHT_USER_ENABLED:true}
    profile:
      searched:
        max-user-result: 10
    participant:
      searched:
        max-user-result: 10
        max-group-result: 10
    group:
      searched:
        max-participant-result: 10
    movement:
      searched:
        max-participant-result: 10
        max-group-result: 5
        max-vehicle-result: 10
        max-activity-result: 10
    communication:
      searched:
        max-activity-result: 10
        max-alert-result: 10
    purge:
      projects:
        cron: 0 30 1 * * *
        months-threshold: 12
        content: # Groupment of movements, communications and alerts
          cron: 0 0 2 * * *
          months-threshold: 12
        configuration: # Groupment of vehicles, activities, groups and participants
          cron: 0 30 2 * * *
          months-threshold: 12
      users:
        cron: 0 0 1 * * *
        months-threshold: 12
      light-users: # Email-only invitations never linked (no oidc_id) — purge stale ones by creation age
        cron: 0 0 3 * * *
        months-threshold: 1
  security:
    default-role: USER
    oauth2:
      jwks-uri: ${IDP_JWKS_URI}
      authorization-uri: ${IDP_AUTHORIZATION_URI}
      token-uri: ${IDP_TOKEN_URI}
      end-session-uri: ${IDP_END_SESSION_URI}
      client-id: ${IDP_PRIVATE_CLIENT_ID}
      client-secret: ${IDP_PRIVATE_CLIENT_SECRET}
      claims:
        user-id: sub
        email: email
        email-verified: email_verified
        first-name: given_name
        last-name: family_name
  server:
    prefix: /api

spring:
  application:
    name: ${registry.information.name}
  flyway:
    schemas: ${DATASOURCE_SCHEMAS:public}
    url: jdbc:postgresql://${DATASOURCE_BASE_URL}/${DATASOURCE_DATABASE:registry}
    user: ${DATASOURCE_USERNAME:registry}
    password: ${DATASOURCE_PASSWORD}
    locations:
      - classpath:db/migrations
  main:
    web-application-type: reactive
    banner-mode: off
  r2dbc:
    # Pool sized to event-loop/database capacity, with driver-side
    # prepared-statement caching; all deploy-tunable, defaults suit local dev.
    url: r2dbc:pool:postgresql://${DATASOURCE_BASE_URL}/${DATASOURCE_DATABASE:registry}?currentSchema=${DATASOURCE_SCHEMAS:public}&initialSize=${DATASOURCE_POOL_SIZE:5}&maxSize=${DATASOURCE_POOL_MAX_SIZE:20}&preparedStatementCacheQueries=${DATASOURCE_PREPARED_STATEMENT_CACHE:256}
    username: ${DATASOURCE_USERNAME:registry}
    password: ${DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDP_JWKS_URI}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${REGISTRY_FEATURE_DOCUMENTATION_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${REGISTRY_FEATURE_DOCUMENTATION_ENABLED:false}
    use-root-path: true
    oauth:
      client-id: ${IDP_PUBLIC_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        # Metrics stay in Prometheus exposition format (Micrometer);
        # VictoriaMetrics scrapes this endpoint. The format is the contract,
        # not the Prometheus server.
        include: prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
