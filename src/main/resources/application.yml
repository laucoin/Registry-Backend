logging:
  level:
    fr.sgdf.registry: ${registry.logging.level}
    org.springframework.web: ${registry.logging.level}

server:
  port: ${registry.deployment.expose-on-port}

spring:
  flyway:
    schemas: ${registry.database.schema}
    url: jdbc:postgresql://${registry.database.base-url}/${registry.database.name}
    user: ${registry.database.username}
    password: ${registry.database.password}
  profiles:
    group:
      sgdf-local: sgdf, sgdf-local
      sgdf-dev: sgdf, sgdf-dev
      sgdf-prod: sgdf, sgdf-prod
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:pool:postgresql://${registry.database.base-url}/${registry.database.name}?currentSchema=${registry.database.schema}
    username: ${registry.database.username}
    password: ${registry.database.password}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${registry.security.sso.certs-url}
  webflux:
    base-path: /api
  application:
    name: ${registry.information.name}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${registry.feature.swagger.enabled:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${registry.feature.swagger.enabled:false}
    oauth:
      client-id: ${registry.security.sso.client-id}
      client-secret: ${registry.security.client-secret}
