name: Release

# S'exécute à chaque merge sur main. main est la base DEV ; les tests ne sont volontairement
# PAS exécutés ici (la protection de branche « Require branches to be up to date before
# merging » garantit que le pipeline de la PR a déjà validé exactement cet arbre).
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  dev-image:
    name: Build & push DEV (main) image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Le Dockerfile est un build multi-étapes autonome (il compile le jar
      # dans son étape de build), aucune configuration Gradle n'est donc nécessaire ici.
      - uses: ./.github/actions/docker-publish
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tag: main
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # semantic-release a besoin de tout l'historique et des tags
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: "24"
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
            @semantic-release/release-notes-generator@14.1.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          # Doit pouvoir pousser la mise à jour de CHANGELOG/version.properties sur la
          # branche main protégée (GITHUB_TOKEN ne peut pas contourner la protection de branche).
          # Utiliser un PAT ou un token GitHub App autorisé à la contourner. Se rabat sur le
          # token par défaut si le secret n'est pas défini.
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release-image:
    name: Build & push release (x.y.z) image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main             # récupérer la mise à jour de version.properties qui vient d'être poussée
      # version.properties est écrit dans le contexte de build ; l'étape de build
      # du Dockerfile le lit, donc le jar embarque la version publiée.
      - name: Pin build to released version
        run: echo "version=${{ needs.release.outputs.version }}" > version.properties
      - uses: ./.github/actions/docker-publish
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tag: ${{ needs.release.outputs.version }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

  retention:
    name: Apply retention policy
    runs-on: ubuntu-latest
    needs: release-image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/registry-retention
        with:
          package-name: ${{ env.IMAGE_NAME }}
          owner: ${{ github.repository_owner }}
          keep-releases: "5"
          token: ${{ secrets.GHCR_PAT }}
