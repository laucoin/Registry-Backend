name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Les lundis à 03:00 UTC

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # publier les résultats dans l'onglet Security
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Kotlin exige une vraie compilation pour une couverture complète : on pilote le build
      # nous-mêmes (build-mode: manual) plutôt que de s'appuyer sur build-mode: none.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile sources
        run: ./gradlew clean assemble -x test --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
