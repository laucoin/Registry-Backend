name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00 UTC

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Kotlin needs a real compile for full coverage, so we drive the build
      # ourselves (build-mode: manual) rather than relying on build-mode: none.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # `clean` is required: build-mode manual extracts only what it watches being
      # compiled, and an up-to-date build compiles nothing. That forces a full Kotlin
      # compilation under CodeQL's tracer on every run, which is what exhausted the
      # default heap — `compileKotlin` died on "GC overhead limit exceeded" while the
      # ordinary build job, which is not traced, passed on the same commit.
      #
      # Memory is set here rather than in gradle.properties so the Docker build and
      # local development keep their own defaults; only the traced build needs this.
      # `in-process` keeps the Kotlin compiler inside the Gradle JVM: with --no-daemon
      # the alternative is a second JVM sized independently, which is what made the
      # footprint hard to reason about.
      - name: Compile sources
        run: >
          ./gradlew clean assemble -x test --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
