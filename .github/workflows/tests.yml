name: Tests

# Source of truth for the main-branch tests + coverage badges: release.yml
# deliberately skips tests on main (the PR pipeline already validated the
# tree), so this workflow re-runs the suite on every merge and uploads the
# Kover report to Codecov.
on:
  push:
    branches: [ main ]

concurrency:
  group: tests-main
  cancel-in-progress: true

jobs:
  tests:
    name: Test & upload coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v6

      # koverXmlReport runs the test suite as a dependency.
      - name: Run tests with coverage
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
