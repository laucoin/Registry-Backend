name: Dependency Review

# Analyse les changements de dépendances introduits par une PR et échoue si l'un d'eux apporte une
# vulnérabilité connue (ou une licence interdite). Nécessite que le Dependency Graph
# soit activé (Settings → Code security).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # publier le commentaire de synthèse

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
