version: 2
updates:
  # ── Dépendances Gradle ──────────────────────────────────────────────
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "gradle"]
    # Préfixe Conventional Commits pour que les merges soient pris en compte par semantic-release.
    # NOTE : d'après les releaseRules de .releaserc, `chore` => release MINOR. Passer
    # le préfixe à `fix` pour que les mises à jour de dépendances sortent en PATCH.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Regrouper toutes les mises à jour mineures et correctifs dans une PR ; les majeures ont chacune leur PR.
      gradle-minor-patch:
        update-types: [minor, patch]

  # ── Images de base du Dockerfile ────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # ── GitHub Actions (workflows + actions composites locales) ────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
