name: Docker publish
description: >-
  Registry-agnostic build & push. Logs in with docker/login-action and builds
  with docker/build-push-action using the GitHub Actions layer cache. Swap the
  `registry`/credentials inputs to migrate from GHCR to Harbor with no other
  workflow changes.

inputs:
  registry:
    description: Container registry host (e.g. ghcr.io, harbor.example.com)
    required: true
  image:
    description: Fully-qualified image name WITHOUT the tag (registry/namespace/name)
    required: true
  tag:
    description: The tag to publish (branch name, "main", x.y.z, or a hotfix tag)
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password or token
    required: true
  context:
    description: Docker build context
    required: false
    default: "."
  file:
    description: Path to the Dockerfile
    required: false
    default: Dockerfile
  push:
    description: Whether to push the built image
    required: false
    default: "true"
  load:
    description: >-
      Load the built image into the local Docker daemon (single-platform only).
      Used to build once, scan the local image, then push in a second call that
      hits the layer cache — so a vulnerable image is never published.
    required: false
    default: "false"
  build-args:
    description: Newline-delimited build args passed to docker build
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ${{ inputs.registry }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build & push ${{ inputs.image }}:${{ inputs.tag }}
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ inputs.image }}:${{ inputs.tag }}
        build-args: ${{ inputs.build-args }}
        # Layer cache stored in the GitHub Actions cache, scoped per image so the
        # backend/frontend and the different tag flows don't evict each other.
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}
        provenance: false
