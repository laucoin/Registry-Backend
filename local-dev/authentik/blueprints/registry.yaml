# Authentik blueprint for local development (validated against Authentik 2026.5).
# It provisions:
#   - a confidential OAuth2 provider + application at slug `registry`, so the issuer
#     is http://localhost:9000/application/o/registry/ and its JWKS is the single key
#     the backend trusts (sub_mode user_uuid → the JWT `sub` is the user UUID);
#   - the five seed users from src/main/resources/db/seed/R__huge_test_dataset.sql
#     (same emails + given/family names), each with a shared dev password. Their
#     Authentik UUIDs are random (User.uuid is not settable); the backend links them
#     to the seeded, email-only accounts on first login (oidc_id is filled in then).
#
# Authentik auto-applies blueprints mounted under /blueprints/custom.
version: 1
metadata:
  name: registry-local
context:
  registry_client_id: !Env [ IDP_PRIVATE_CLIENT_ID, registry ]
  registry_client_secret: !Env [ IDP_PRIVATE_CLIENT_SECRET, registry-secret ]
entries:
  # Default Authentik puts the whole display name in given_name and leaves
  # family_name empty; the backend needs a real given/family split, so emit the
  # claims from the per-user attributes set below.
  - model: authentik_providers_oauth2.scopemapping
    id: registry-profile-scope
    identifiers:
      name: Registry local profile
    attrs:
      scope_name: profile
      description: Registry profile claims (split given/family name)
      expression: |
        return {
            "name": request.user.name,
            "given_name": request.user.attributes.get("given_name", request.user.name),
            "family_name": request.user.attributes.get("family_name", ""),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
        }

  # --- Seed users (match src/main/resources/db/seed/R__huge_test_dataset.sql) ---
  # All active in Authentik; the "blocked" semantics live in the backend seed
  # (blocked-user is visible=false there), so logging in as blocked-user links the
  # account and is then rejected with 423 LOCKED — exercising that path.
  - model: authentik_core.user
    id: registry-user-administrator
    identifiers:
      username: administrator
    attrs:
      name: Jane SMITH
      attributes:
        given_name: Jane
        family_name: SMITH
      email: administrator@sgdf.fr
      password: !Env [ AU_DEV_PASSWORD, "" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-coordinator
    identifiers:
      username: coordinator
    attrs:
      name: John DOE
      attributes:
        given_name: John
        family_name: DOE
      email: coordinator@sgdf.fr
      password: !Env [ AU_DEV_PASSWORD, "" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-participant
    identifiers:
      username: participant
    attrs:
      name: Charles PINA
      attributes:
        given_name: Charles
        family_name: PINA
      email: participant@sgdf.fr
      password: !Env [ AU_DEV_PASSWORD, "" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-blocked-user
    identifiers:
      username: blocked-user
    attrs:
      name: Aliyah NIELSEN
      attributes:
        given_name: Aliyah
        family_name: NIELSEN
      email: blocked-user@sgdf.fr
      password: !Env [ AU_DEV_PASSWORD, "" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-blocked-profile
    identifiers:
      username: blocked-profile
    attrs:
      name: Emil BRADFORD
      attributes:
        given_name: Emil
        family_name: BRADFORD
      email: blocked-profile@sgdf.fr
      password: !Env [ AU_DEV_PASSWORD, "" ]
      is_active: true
      path: users

  # RP-initiated logout has to do BOTH halves, and neither Authentik default does:
  # `default-provider-invalidation-flow` honours post_logout_redirect_uri but ships
  # with no stages, so it drops the application session and leaves the SSO one
  # alive — the next protected page signs the user straight back in;
  # `default-invalidation-flow` does carry the user-logout stage, but it is the
  # brand's own logout flow and ends on Authentik's login page instead of returning
  # to the app. So the provider gets its own invalidation flow: the shipped logout
  # stage, reached through the provider, which returns to post_logout_redirect_uri.
  - model: authentik_flows.flow
    id: registry-invalidation-flow
    identifiers:
      slug: registry-provider-invalidation
    attrs:
      name: Logged out of Registry
      title: You have been logged out
      designation: invalidation

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf registry-invalidation-flow
      order: 0
    attrs:
      stage: !Find [ authentik_stages_user_logout.userlogoutstage, [ name, default-invalidation-logout ] ]

  - model: authentik_providers_oauth2.oauth2provider
    id: registry-provider
    identifiers:
      name: registry
    attrs:
      client_type: confidential
      client_id: !Context registry_client_id
      client_secret: !Context registry_client_secret
      # Browser login: authorization_code + refresh token rotation.
      grant_types:
        - authorization_code
        - refresh_token
      # The backend parses `sub` as a UUID (TokenConverterService); user_uuid makes
      # the `sub` the user's UUID, which the backend links to tb_user.oidc_id.
      sub_mode: user_uuid
      authentication_flow: !Find [ authentik_flows.flow, [ slug, default-authentication-flow ] ]
      authorization_flow: !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !KeyOf registry-invalidation-flow
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/auth/callback
        - matching_mode: strict
          url: http://localhost:8081/swagger-ui/oauth2-redirect.html
      # offline_access is what makes the IdP issue a usable refresh token. Without
      # this mapping Authentik hands out none at all, the BFF's silent renewal has
      # nothing to renew with, and every session dies the moment its access token
      # expires (ADR 022). The app requests the scope in
      # Registry-Frontend/server/routes/auth/login.get.ts.
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, email ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, offline_access ] ]
        - !KeyOf registry-profile-scope

  - model: authentik_core.application
    identifiers:
      slug: registry
    attrs:
      name: Registry
      provider: !KeyOf registry-provider
