# Authentik blueprint for local development (validated against Authentik 2026.5).
# It provisions:
#   - a confidential OAuth2 provider + application at slug `registry` for the backend's own
#     authorization_code login (sub_mode user_uuid -> the JWT `sub` is the user UUID, which
#     TokenConverterService links to tb_user.oidc_id);
#   - a public OAuth2 provider + application at slug `registry-swagger` for Swagger UI's
#     implicit-flow "Authorize" button (SwaggerConfig.kt), redirecting back to the management
#     port (see README: SERVER_MANAGEMENT_PORT);
#   - the six seed users from src/main/resources/db/seed/R__seed_dev_users.sql (same emails
#     and given/family names), all sharing the AU_PASS password. Their Authentik UUIDs
#     are random (authentik_core.user.uuid is not settable); the backend links them to the
#     seeded, email-only accounts on first login (oidc_id is filled in then).
#
# The seed only loads under the `local` Spring profile (application-local.yml) - run the
# backend with SPRING_PROFILES_ACTIVE=local so the two sides match up.
#
# Authentik auto-applies blueprints mounted under /blueprints/custom.
version: 1
metadata:
  name: registry-local
context:
  registry_client_id: !Env [ IDP_PRIVATE_CLIENT_ID, registry ]
  registry_client_secret: !Env [ IDP_PRIVATE_CLIENT_SECRET, registry-secret ]
  registry_swagger_client_id: !Env [ IDP_PUBLIC_CLIENT_ID, registry-swagger ]
entries:
  # Default Authentik puts the whole display name in given_name and leaves family_name
  # empty; the backend needs a real given/family split (registry.security.oauth2.claims.*),
  # so emit the claims from the per-user attributes set below.
  - model: authentik_providers_oauth2.scopemapping
    id: registry-profile-scope
    identifiers:
      name: Registry local profile
    attrs:
      scope_name: profile
      description: Registry profile claims (split given/family name)
      expression: |
        return {
            "name": request.user.name,
            "given_name": request.user.attributes.get("given_name", request.user.name),
            "family_name": request.user.attributes.get("family_name", ""),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
        }

  # ------------------------------------------------------------------------- Backend (confidential)
  - model: authentik_providers_oauth2.oauth2provider
    id: registry-provider
    identifiers:
      name: registry
    attrs:
      client_type: confidential
      client_id: !Context registry_client_id
      client_secret: !Context registry_client_secret
      # The backend brokers the code exchange itself (IdpAuthenticationAdapter) and also
      # calls the refresh grant, so both must be allowed.
      grant_types:
        - authorization_code
        - refresh_token
      sub_mode: user_uuid
      authentication_flow: !Find [ authentik_flows.flow, [ slug, default-authentication-flow ] ]
      authorization_flow: !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !Find [ authentik_flows.flow, [ slug, default-provider-invalidation-flow ] ]
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      redirect_uris:
        # Best-guess default for the Angular frontend (see README's EXTERNAL_CORS_URLS
        # example, http://localhost:4200) - override with IDP_FRONTEND_REDIRECT_URI if your
        # frontend's actual callback route differs.
        - matching_mode: strict
          url: !Env [ IDP_FRONTEND_REDIRECT_URI, "http://localhost:4200/auth/callback" ]
      # offline_access is what makes the IdP issue a usable refresh token; without this
      # mapping Authentik hands out none, and refreshAuthenticationToken has nothing to use.
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, email ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, offline_access ] ]
        - !KeyOf registry-profile-scope

  - model: authentik_core.application
    id: registry-application
    identifiers:
      slug: registry
    attrs:
      name: Registry
      provider: !KeyOf registry-provider

  # ------------------------------------------------------------------------- Swagger UI (public)
  # Swagger runs in the browser and holds no secret, so it cannot be the backend's confidential
  # client: the provider would refuse it at the token endpoint for failing to authenticate.
  # SwaggerConfig.kt configures the OAuth2 implicit flow, so this provider is public/implicit
  # rather than the authorization_code + PKCE shape a browser client would otherwise use.
  - model: authentik_providers_oauth2.oauth2provider
    id: registry-swagger-provider
    identifiers:
      name: registry-swagger
    attrs:
      client_type: public
      client_id: !Context registry_swagger_client_id
      grant_types:
        - implicit
      sub_mode: user_uuid
      authentication_flow: !Find [ authentik_flows.flow, [ slug, default-authentication-flow ] ]
      authorization_flow: !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !Find [ authentik_flows.flow, [ slug, default-provider-invalidation-flow ] ]
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      redirect_uris:
        # Swagger UI now loads from the management port (see README: SERVER_MANAGEMENT_PORT),
        # and springdoc.use-management-port routes its OAuth2 callback there too. The path has
        # no /actuator prefix: management.endpoints.web.base-path is "/".
        - matching_mode: strict
          url: !Env [ IDP_SWAGGER_REDIRECT_URI, "http://localhost:8082/swagger-ui/oauth2-redirect.html" ]
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, email ] ]
        - !KeyOf registry-profile-scope

  - model: authentik_core.application
    id: registry-swagger-application
    identifiers:
      slug: registry-swagger
    attrs:
      name: Registry Swagger
      provider: !KeyOf registry-swagger-provider

  # ------------------------------------------------------------------------ test personas
  # Match src/main/resources/db/seed/R__seed_dev_users.sql (loaded under the `local` profile).
  # All active in Authentik; the "blocked" semantics live in the backend seed
  # (blocked-user is visible=false there), so logging in as blocked-user links the account
  # and is then rejected by the backend.
  - model: authentik_core.user
    id: registry-user-administrator
    identifiers:
      username: administrator
    attrs:
      name: Jane SMITH
      attributes:
        given_name: Jane
        family_name: SMITH
      email: administrator@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-coordinator
    identifiers:
      username: coordinator
    attrs:
      name: John DOE
      attributes:
        given_name: John
        family_name: DOE
      email: coordinator@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-participant
    identifiers:
      username: participant
    attrs:
      name: Charles PINA
      attributes:
        given_name: Charles
        family_name: PINA
      email: participant@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-blocked-user
    identifiers:
      username: blocked-user
    attrs:
      name: Aliyah NIELSEN
      attributes:
        given_name: Aliyah
        family_name: NIELSEN
      email: blocked-user@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-blocked-profile
    identifiers:
      username: blocked-profile
    attrs:
      name: Emil BRADFORD
      attributes:
        given_name: Emil
        family_name: BRADFORD
      email: blocked-profile@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-unverified
    identifiers:
      username: unverified
    attrs:
      name: Nina VOGEL
      attributes:
        given_name: Nina
        family_name: VOGEL
      email: unverified@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users
