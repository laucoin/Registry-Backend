# Blueprint Authentik pour le développement local (validé avec Authentik 2026.5).
# Il provisionne :
#   - un provider OAuth2 confidentiel + une application au slug `registry` pour le login
#     authorization_code du backend (sub_mode user_uuid -> le `sub` du JWT est l'UUID utilisateur, que
#     TokenConverterService relie à tb_user.oidc_id) ;
#   - un provider OAuth2 public + une application au slug `registry-swagger` pour le bouton
#     « Authorize » authorization-code + PKCE de Swagger UI (SwaggerConfig.kt), avec redirection vers le port
#     de management (voir README : SERVER_MANAGEMENT_PORT) ;
#   - les six utilisateurs du seed src/main/resources/db/seed/R__seed_dev_dataset.sql (mêmes e-mails
#     et mêmes prénoms/noms), tous avec le mot de passe AU_PASS. Leurs UUID Authentik
#     sont aléatoires (authentik_core.user.uuid n'est pas modifiable) ; le backend les relie aux
#     comptes du seed, identifiés par e-mail seul, à la première connexion (oidc_id est alors renseigné).
#
# Le seed ne se charge que sous le profil Spring `local` (application-local.yml) - lancer le
# backend avec SPRING_PROFILES_ACTIVE=local pour que les deux côtés correspondent.
#
# Authentik applique automatiquement les blueprints montés sous /blueprints/custom.
version: 1
metadata:
  name: registry-local
context:
  registry_client_id: !Env [ IDP_PRIVATE_CLIENT_ID, registry ]
  registry_client_secret: !Env [ IDP_PRIVATE_CLIENT_SECRET, registry-secret ]
  registry_swagger_client_id: !Env [ IDP_PUBLIC_CLIENT_ID, registry-swagger ]
entries:
  # Par défaut, Authentik met tout le nom affiché dans given_name et laisse family_name
  # vide ; le backend a besoin d'une vraie séparation prénom/nom (registry.security.oauth2.claims.*),
  # on émet donc les claims à partir des attributs par utilisateur définis plus bas.
  - model: authentik_providers_oauth2.scopemapping
    id: registry-profile-scope
    identifiers:
      name: Registry local profile
    attrs:
      scope_name: profile
      description: Registry profile claims (split given/family name)
      expression: |
        return {
            "name": request.user.name,
            "given_name": request.user.attributes.get("given_name", request.user.name),
            "family_name": request.user.attributes.get("family_name", ""),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
        }

  # ------------------------------------------------------------------------- Backend (confidential)
  - model: authentik_providers_oauth2.oauth2provider
    id: registry-provider
    identifiers:
      name: registry
    attrs:
      client_type: confidential
      client_id: !Context registry_client_id
      client_secret: !Context registry_client_secret
      # Le backend réalise lui-même l'échange du code (IdpAuthenticationAdapter) et appelle aussi
      # le grant de refresh : les deux doivent donc être autorisés.
      grant_types:
        - authorization_code
        - refresh_token
      sub_mode: user_uuid
      authentication_flow: !Find [ authentik_flows.flow, [ slug, default-authentication-flow ] ]
      authorization_flow: !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !Find [ authentik_flows.flow, [ slug, default-provider-invalidation-flow ] ]
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      redirect_uris:
        # Valeur par défaut supposée pour le frontend Angular (voir l'exemple EXTERNAL_CORS_URLS
        # du README, http://localhost:4200) - surcharger avec IDP_FRONTEND_REDIRECT_URI si la route
        # de callback réelle du frontend diffère.
        - matching_mode: strict
          url: !Env [ IDP_FRONTEND_REDIRECT_URI, "http://localhost:4200/auth/callback" ]
      # offline_access permet à l'IdP d'émettre un refresh token utilisable ; sans ce
      # mapping Authentik n'en fournit aucun, et refreshAuthenticationToken n'a rien à utiliser.
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, email ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, offline_access ] ]
        - !KeyOf registry-profile-scope

  - model: authentik_core.application
    id: registry-application
    identifiers:
      slug: registry
    attrs:
      name: Registry
      provider: !KeyOf registry-provider

  # ------------------------------------------------------------------------- Swagger UI (public)
  # Swagger s'exécute dans le navigateur et ne détient aucun secret : il ne peut pas être le client
  # confidentiel du backend, le provider le refuserait au token endpoint faute d'authentification.
  # SwaggerConfig.kt configure le flux OAuth2 authorization code avec PKCE. Le flux implicit
  # n'est pas utilisable ici : Authentik rejette le `response_type=token` simple qu'envoie Swagger UI.
  - model: authentik_providers_oauth2.oauth2provider
    id: registry-swagger-provider
    identifiers:
      name: registry-swagger
    attrs:
      client_type: public
      client_id: !Context registry_swagger_client_id
      grant_types:
        - authorization_code
      sub_mode: user_uuid
      authentication_flow: !Find [ authentik_flows.flow, [ slug, default-authentication-flow ] ]
      authorization_flow: !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !Find [ authentik_flows.flow, [ slug, default-provider-invalidation-flow ] ]
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      redirect_uris:
        # Swagger UI se charge désormais depuis le port de management (voir README : SERVER_MANAGEMENT_PORT),
        # et springdoc.use-management-port y route aussi son callback OAuth2. Le chemin n'a
        # pas de préfixe /actuator : management.endpoints.web.base-path vaut "/".
        - matching_mode: strict
          url: !Env [ IDP_SWAGGER_REDIRECT_URI, "http://localhost:8082/swagger-ui/oauth2-redirect.html" ]
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, email ] ]
        - !KeyOf registry-profile-scope

  - model: authentik_core.application
    id: registry-swagger-application
    identifiers:
      slug: registry-swagger
    attrs:
      name: Registry Swagger
      provider: !KeyOf registry-swagger-provider

  # ------------------------------------------------------------------------ personas de test
  # Correspond à src/main/resources/db/seed/R__seed_dev_dataset.sql (chargé sous le profil `local`).
  # Tous actifs dans Authentik ; la sémantique « bloqué » vit dans le seed du backend
  # (blocked-user y a visible=false) : se connecter en tant que blocked-user relie le compte
  # puis est rejeté par le backend.
