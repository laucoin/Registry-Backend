version: 1

metadata:
  name: Registry - local dev
  labels:
    blueprints.goauthentik.io/instantiate: "true"

context:
  private_client_id: !Env [ OIDC_PRIVATE_CLIENT_ID, registry ]
  private_client_secret: !Env [ OIDC_PRIVATE_CLIENT_SECRET, registry-secret ]
  private_redirect_uri: !Env [ OIDC_PRIVATE_REDIRECT_URI, "http://localhost:4200/auth/callback" ]
  public_client_id: !Env [ OIDC_PUBLIC_CLIENT_ID, registry-swagger ]
  public_redirect_uri:
    !Env [ OIDC_PUBLIC_REDIRECT_URI, "http://localhost:8082/actuator/swagger-ui/oauth2-redirect.html" ]
  dev_password: !Env [ AU_DEV_PASSWORD, dev123 ]

entries:

  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: Registry local profile
    attrs:
      scope_name: profile
      description: First and last names read from user attributes, as Registry expects
      expression: |
        return {
            "name": request.user.name,
            "given_name": request.user.attributes.get("given_name", request.user.name),
            "family_name": request.user.attributes.get("family_name", ""),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
        }

  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: Registry local email
    attrs:
      scope_name: email
      description: Email with a verification flag driven by user attributes
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified", True),
        }

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: registry
    attrs:
      client_type: confidential
      client_id: !Context private_client_id
      client_secret: !Context private_client_secret
      authorization_flow:
        !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !Find [ authentik_flows.flow, [ slug, default-provider-invalidation-flow ] ]
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      sub_mode: user_uuid
      issuer_mode: per_provider
      include_claims_in_id_token: true
      logout_method: backchannel
      grant_types:
        - authorization_code
        - refresh_token
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      redirect_uris:
        - url: !Context private_redirect_uri
          matching_mode: strict
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ managed, goauthentik.io/providers/oauth2/scope-openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ managed, goauthentik.io/providers/oauth2/scope-offline_access ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ name, Registry local profile ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ name, Registry local email ] ]

  - model: authentik_core.application
    identifiers:
      slug: registry
    attrs:
      name: Registry
      provider: !Find [ authentik_providers_oauth2.oauth2provider, [ name, registry ] ]

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: registry-swagger
    attrs:
      client_type: public
      client_id: !Context public_client_id
      authorization_flow:
        !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !Find [ authentik_flows.flow, [ slug, default-provider-invalidation-flow ] ]
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      sub_mode: user_uuid
      issuer_mode: per_provider
      include_claims_in_id_token: true
      logout_method: backchannel
      grant_types:
        - authorization_code
        - refresh_token
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      redirect_uris:
        - url: !Context public_redirect_uri
          matching_mode: strict
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ managed, goauthentik.io/providers/oauth2/scope-openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ name, Registry local profile ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ name, Registry local email ] ]

  - model: authentik_core.application
    identifiers:
      slug: registry-swagger
    attrs:
      name: Registry Swagger
      provider: !Find [ authentik_providers_oauth2.oauth2provider, [ name, registry-swagger ] ]

  - model: authentik_core.user
    identifiers:
      username: administrator
    attrs:
      name: Jane SMITH
      email: administrator@sgdf.fr
      path: users
      type: internal
      is_active: true
      password: !Context dev_password
      attributes:
        given_name: Jane
        family_name: SMITH

  - model: authentik_core.user
    identifiers:
      username: coordinator
    attrs:
      name: John DOE
      email: coordinator@sgdf.fr
      path: users
      type: internal
      is_active: true
      password: !Context dev_password
      attributes:
        given_name: John
        family_name: DOE

  - model: authentik_core.user
    identifiers:
      username: participant
    attrs:
      name: Charles PINA
      email: participant@sgdf.fr
      path: users
      type: internal
      is_active: true
      password: !Context dev_password
      attributes:
        given_name: Charles
        family_name: PINA

  - model: authentik_core.user
    identifiers:
      username: blocked-user
    attrs:
      name: Aliyah NIELSEN
      email: blocked-user@sgdf.fr
      path: users
      type: internal
      is_active: true
      password: !Context dev_password
      attributes:
        given_name: Aliyah
        family_name: NIELSEN

  - model: authentik_core.user
    identifiers:
      username: blocked-profile
    attrs:
      name: Emil BRADFORD
      email: blocked-profile@sgdf.fr
      path: users
      type: internal
      is_active: true
      password: !Context dev_password
      attributes:
        given_name: Emil
        family_name: BRADFORD

  - model: authentik_core.user
    identifiers:
      username: unverified
    attrs:
      name: Nina VOGEL
      email: unverified@sgdf.fr
      path: users
      type: internal
      is_active: true
      password: !Context dev_password
      attributes:
        given_name: Nina
        family_name: VOGEL
        email_verified: false
