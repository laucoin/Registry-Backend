# Provisions everything Registry needs from the identity provider, so that a fresh
# `docker compose up` yields a working login without a single click in the Authentik UI.
#
# Authentik's worker applies every file mounted under /blueprints/custom, and re-applies it
# on change. Entries are matched on their `identifiers`, so editing this file updates the
# existing objects rather than creating duplicates.
version: 1
metadata:
  name: Registry — OAuth2 providers, applications and a test user

context:
  # Where the SPA and the Swagger UI send the user back after authenticating.
  frontend_url: http://localhost:4200
  swagger_url: http://localhost:8081

entries:
  # ---------------------------------------------------------------- backend (confidential)
  # The client the backend brokers the authorization-code exchange with. Its secret never
  # reaches the browser, which is the whole point of ADR 004.
  - id: provider-backend
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Registry
    attrs:
      client_type: confidential
      client_id: !Env [IDP_PRIVATE_CLIENT_ID, registry]
      client_secret: !Env [IDP_PRIVATE_CLIENT_SECRET, ""]
      # Explicit since Authentik 2026.5: the field defaults to an empty list, and an empty
      # list refuses every token request with "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      # `sub` must parse as a UUID: the backend reads it straight into UUID.fromString.
      # Authentik's default (hashed_user_id) is not a UUID and would break token conversion.
      sub_mode: user_uuid
      # Registry validates signatures against the JWKS endpoint, so the tokens must be
      # asymmetrically signed. Without a signing key Authentik falls back to HS256 and the
      # JWKS endpoint serves nothing.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Context frontend_url]

  - id: app-backend
    model: authentik_core.application
    identifiers:
      slug: registry
    attrs:
      name: Registry
      provider: !KeyOf provider-backend

  # ---------------------------------------------------------------- Swagger UI (public)
  # Swagger authenticates as its own client, so its tokens carry a different `aud` than the
  # ones the frontend obtains. This is exactly why the backend accepts a list of audiences
  # rather than a single value.
  - id: provider-swagger
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Registry Swagger
    attrs:
      client_type: public
      client_id: !Env [IDP_PUBLIC_CLIENT_ID, registry-swagger]
      grant_types:
        - authorization_code
        - refresh_token
      sub_mode: user_uuid
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/swagger-ui/oauth2-redirect.html", !Context swagger_url]

  - id: app-swagger
    model: authentik_core.application
    identifiers:
      slug: registry-swagger
    attrs:
      name: Registry Swagger
      provider: !KeyOf provider-swagger

  # ---------------------------------------------------------------- test user
  # A non-admin account, so the default USER role and the JIT provisioning path are what a
  # developer actually exercises. The first sign-in auto-provisions the matching Registry user.
  - id: user-dev
    model: authentik_core.user
    identifiers:
      username: registry-dev
    attrs:
      name: Registry Developer
      email: registry-dev@localhost
      # Scalar form on purpose: no fallback value. A default here would be a known password
      # for six accounts, committed to the repository — which is what it looks like, because
      # that is what it would be. Unset, the accounts get no usable password and the developer
      # is pointed at AU_DEV_PASSWORD in .example.env.
      password: !Env AU_DEV_PASSWORD
      is_active: true
      path: users
