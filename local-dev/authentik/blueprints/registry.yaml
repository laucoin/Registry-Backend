    id: 865f44e7-1fe0-4ce4-87e5-8159f581894d
    identifiers:
      username: administrator
    attrs:
      name: Jane SMITH
      attributes:
        given_name: Jane
        family_name: SMITH
      email: administrator@sgdf.fr
      password: !Env [ AU_PASS, "dev123" ]
      is_active: true
      path: users

