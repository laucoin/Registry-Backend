# .gitlab-ci.yml

stages:
  - "🧪 Test code 🧪"
  - "⚙️ Build ⚙️"
  - "🆕 Release 🆕"
  - "🧑‍🔧 Hotfix 🧑‍🔧"
  - "🚀 Deploy 🚀"

######### 🧪 Test code 🧪 #########

"👨‍💻 Executing tests 👩‍💻":
  stage: "🧪 Test code 🧪"
  image: gradle:9.1.0-jdk21-alpine
  services:
    - docker:dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  rules:
    - when: never
  #    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - gradle test

########### ⚙️ Build ⚙️ ###########

"👨‍💻 Building project 👩‍💻":
  stage: "⚙️ Build ⚙️"
  image: gradle:9.1.0-jdk21-alpine
  rules:
    - if: $HOTFIX
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH_SLUG
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_SLUG =~ /^[0-9]+-[0-9]+-[0-9]+/
  script:
    - gradle build -x test
  artifacts:
    paths:
      - build/
    expire_in: 2 hours

"👨‍💻 Building docker image 👩‍💻":
  stage: "⚙️ Build ⚙️"
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $HOTFIX
      when: never
    - if: $CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH_SLUG
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_SLUG =~ /^[0-9]+-[0-9]+-[0-9]+/
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs:
    - job: "👨‍💻 Building project 👩‍💻"
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - |
      case "$CI_COMMIT_TAG" in
        '' )
          TAG="latest"
          ;;
        *-hotfix )
          TAG="hotfix"
          ;;
        * )
          TAG="prod"
          ;;
      esac
      export TAG
      echo "TAG is set to \"$TAG\""
    - |
      export IMAGE_TAG="$CI_REGISTRY_IMAGE:$TAG"
      echo "IMAGE_TAG is set to \"$IMAGE_TAG\""
  script:
    - docker build --pull -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

########## 🆕 Release 🆕 ##########

"🆕 Creating release 🆕":
  stage: "🆕 Release 🆕"
  image: node:lts-slim
  rules:
    - if: $HOTFIX
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH_SLUG
    - when: never
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git-core ca-certificates
    - npm install -g semantic-release @semantic-release/gitlab @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/git @semantic-release/exec conventional-changelog-conventionalcommits
  script:
    - semantic-release --config .releaserc.json

###### 🧑‍🔧 Hotfix workflow 🧑‍🔧 ######

"🧑‍🔧 Creating hotfix branch 🧑‍🔧":
  stage: "🧑‍🔧 Hotfix 🧑‍🔧"
  rules:
    - if: $HOTFIX == "start" && $CI_COMMIT_REF_SLUG =~ /^[0-9]+-[0-9]+-[0-9]+$/
  before_script:
    - |
      BASE_VERSION=$(echo "$CI_COMMIT_REF_SLUG" | grep -oE '^[0-9]+-[0-9]+-[0-9]+')
      BASE_VERSION=${BASE_VERSION//-/.}
      export BASE_VERSION
      git fetch --tags
      HOTFIX_TAGS=$(git tag --list "$BASE_VERSION-hotfix-*")
      if [[ -z "$HOTFIX_TAGS" ]]; then
        NEXT_HOTFIX_NUM=1
        HOTFIX_ORIGIN=$BASE_VERSION
      else
        MAX_HOTFIX_NUM=$(echo "$HOTFIX_TAGS" | grep -oE '[0-9]+$' | sort -nr | head -n1)
        HOTFIX_ORIGIN="$BASE_VERSION-hotfix-$MAX_HOTFIX_NUM"
        NEXT_HOTFIX_NUM=$((MAX_HOTFIX_NUM + 1))
      fi
      export HOTFIX_ORIGIN
      export NEXT_HOTFIX_NUM
      echo "Creating branch the \"$NEXT_HOTFIX_NUM\" of the version \"$BASE_VERSION\""
    - |
      cd ..
      rm -rf ${CI_PROJECT_NAME}
      git clone https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}.git
      cd ${CI_PROJECT_NAME}
      git config --global user.email "service-account@laucoin.fr"
      git config --global user.name "Service account"
  script:
    - export HOTFIX_BRANCH="$BASE_VERSION-hotfix-$NEXT_HOTFIX_NUM"
    - |
      git fetch origin
      git checkout -b "$HOTFIX_BRANCH" "$HOTFIX_ORIGIN"
      git push origin "$HOTFIX_BRANCH"

"🧑‍🔧 Finishing hotfix 🧑‍🔧":
  stage: "🧑‍🔧 Hotfix 🧑‍🔧"
  rules:
    - if: $HOTFIX == "finish" && $CI_COMMIT_REF_SLUG =~ /^[0-9]+-[0-9]+-[0-9]+-hotfix-[0-9]+$/
  before_script:
    - export HOTFIX_TAG="$CI_COMMIT_REF_SLUG"
    - git fetch --tags
    - |
      if git tag --list | grep -q "^${HOTFIX_TAG}$"; then
        echo "Hotfix ${HOTFIX_TAG} already exists."
        echo "Existing tags with this version:"
        git tag --list | grep -q "^$CI_COMMIT_REF_SLUG"
        exit 1
      fi
    - |
      cd ..
      rm -rf ${CI_PROJECT_NAME}
      git clone https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}.git
      cd ${CI_PROJECT_NAME}
      git config --global user.email "service-account@laucoin.fr"
      git config --global user.name "Service account"
  script:
    - |
      if [[ -z "$HOTFIX_BRANCH" ]]; then
        echo "HOTFIX_BRANCH variable is required"
        exit 1
      fi
      git fetch origin
      git checkout "$HOTFIX_BRANCH"
      git tag "$HOTFIX_BRANCH"
      git push origin "$HOTFIX_BRANCH"
      git push origin "$HOTFIX_BRANCH" --tags

########## 🚀 Deploy 🚀 ###########

.deploy:
  stage: "🚀 Deploy 🚀"
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - eval `ssh-agent -s`
    - echo "${SSH_PRIVATE_KEY}" | base64 -d | tr -d '\r' | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} -p ${SSH_PORT} "uptime"

"🚀 Deploying in development environment 🚀":
  environment:
    name: development
  needs:
    - "👨‍💻 Building docker image 👩‍💻"
  rules:
    - if: $HOTFIX
      when: never
    - if: $CI_COMMIT_REF_SLUG == $CI_DEFAULT_BRANCH_SLUG && $CI_PIPELINE_SOURCE != "web"
      when: on_success
    - when: never
  extends: .deploy

"🚀 Deploying in production environment 🚀":
  environment:
    name: production
  needs:
    - "👨‍💻 Building docker image 👩‍💻"
  rules:
    - if: $HOTFIX
      when: never
    - if: $CI_COMMIT_TAG || ($CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_SLUG =~ /^[0-9]+-[0-9]+-[0-9]+/)
      when: manual
    - when: never
  extends: .deploy
