# Le build-mode=manual de CodeQL instrumente la JVM pendant `./gradlew clean assemble`, ce qui
# laisse moins de marge que ne le suppose l'auto-détection mémoire du démon de compilation Kotlin. Cela
# a provoqué « GC overhead limit exceeded » lors de la génération du bytecode des plus gros mappers sur le
# runner CI (sans rapport avec la source compilée). On fixe un tas explicite et généreux plutôt que de
# s'appuyer sur l'auto-détection.
kotlin.daemon.jvmargs=-Xmx4g
