# CodeQL's build-mode=manual instruments the JVM while running `./gradlew clean assemble`, which
# leaves less headroom than the Kotlin compile daemon's own memory auto-detection assumes. That
# caused "GC overhead limit exceeded" while generating bytecode for larger mapper classes on the
# CI runner (unrelated to the source being compiled). Pin an explicit, generous heap instead of
# relying on auto-detection.
kotlin.daemon.jvmargs=-Xmx4g

# The Gradle daemon's native-platform library (file watching, etc.) calls System::load, which
# JEP 472 flags as a restricted method on Java 24+ — silence the warning it prints on every build.
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED
