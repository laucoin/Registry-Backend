services:
  registry_database:
    image: postgres:17-alpine
    container_name: registry_database
    networks:
      - registry_network
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_MULTIPLE_DATABASES: $DB_REGISTRY,$DB_SSO
    restart: 'unless-stopped'
    volumes:
      - ./docker-volume/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  registry_keycloak:
    image: registry.gitlab.com/laucoin/keycloak-theme:main
    container_name: registry_keycloak
    networks:
      - registry_network
    ports:
      - '8080:8080'
    environment:
      KC_DB: 'postgres'
      KC_DB_URL: 'jdbc:postgresql://registry_database:5432/keycloak'
      KC_DB_USERNAME: $DB_USERNAME
      KC_DB_PASSWORD: $DB_PASSWORD
      KC_DB_SCHEMA: 'public'
      KEYCLOAK_ADMIN: $KC_ADMIN_USERNAME
      KEYCLOAK_ADMIN_PASSWORD: $KC_ADMIN_PASSWORD
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    volumes:
      - ./docker-volume/keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/keycloak-theme.jar
    command:
      - start-dev
    restart: 'unless-stopped'
    depends_on:
      registry_database:
        condition: service_healthy

networks:
  registry_network:
    name: registry_network
